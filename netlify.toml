# ── Lucas Casagrande — portfolio deploy config ───────────────────
[build]
  publish = "."

# Consolidate the historical public Netlify host on the canonical custom domain.
# Deploy permalinks and previews use a different host and remain inspectable.
[[redirects]]
  from = "https://lucascasagrande.netlify.app/*"
  to = "https://lucascasagrande.com/:splat"
  status = 301
  force = true
[[redirects]]
  from = "http://lucascasagrande.netlify.app/*"
  to = "https://lucascasagrande.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/work/jump-saudi/*"
  to = "/work/mtv-bull-on-drugs/"
  status = 301
[[redirects]]
  from = "/work/unicards-animatic/*"
  to = "/work/continuous-reflection/"
  status = 301
[[redirects]]
  from = "/work/stc-invest/*"
  to = "/work/"
  status = 301
[[redirects]]
  from = "/work/crystal-light/*"
  to = "/work/"
  status = 301
[[redirects]]
  from = "/work/stc-card/*"
  to = "/work/"
  status = 301
[[redirects]]
  from = "/work/f1-2019/*"
  to = "/work/"
  status = 301
[[redirects]]
  from = "/work/viva-carriage/*"
  to = "/work/claro-reel/"
  status = 301

[[redirects]]
  from = "/en/work/jump-saudi/*"
  to = "/en/work/mtv-bull-on-drugs/"
  status = 301
[[redirects]]
  from = "/en/work/unicards-animatic/*"
  to = "/en/work/continuous-reflection/"
  status = 301
[[redirects]]
  from = "/en/work/stc-invest/*"
  to = "/en/work/"
  status = 301
[[redirects]]
  from = "/en/work/crystal-light/*"
  to = "/en/work/"
  status = 301
[[redirects]]
  from = "/en/work/stc-card/*"
  to = "/en/work/"
  status = 301
[[redirects]]
  from = "/en/work/f1-2019/*"
  to = "/en/work/"
  status = 301
[[redirects]]
  from = "/en/work/viva-carriage/*"
  to = "/en/work/claro-reel/"
  status = 301
[[redirects]]
  from = "/en/*"
  to = "/en/404.html"
  status = 404

# Pretty 404 for any unknown path
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ── Security & performance headers ───────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https://framerusercontent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; frame-src https://player.vimeo.com; connect-src 'self' https://player.vimeo.com; media-src 'self'; base-uri 'self'; form-action 'self'"

# Long-cache static assets, always revalidate HTML
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Bilingual response metadata and PDF language alternates

[[headers]]
  for = "/"
  [headers.values]
    Content-Language = "es-AR"

[[headers]]
  for = "/en/*"
  [headers.values]
    Content-Language = "en"

[[headers]]
  for = "/assets/press/Lucas_Casagrande_Press_Kit_2026_Horizontal.pdf"
  [headers.values]
    Content-Language = "es-AR"
    Link = "<https://lucascasagrande.com/assets/press/Lucas_Casagrande_Press_Kit_2026_Horizontal.pdf>; rel=\"canonical\", <https://lucascasagrande.com/assets/press/Lucas_Casagrande_Press_Kit_2026_Horizontal.pdf>; rel=\"alternate\"; hreflang=\"es-AR\", <https://lucascasagrande.com/assets/press/Lucas_Casagrande_Press_Kit_2026_Horizontal_EN.pdf>; rel=\"alternate\"; hreflang=\"en\", <https://lucascasagrande.com/assets/press/Lucas_Casagrande_Press_Kit_2026_Horizontal.pdf>; rel=\"alternate\"; hreflang=\"x-default\""

