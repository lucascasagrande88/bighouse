# ── Lucas Casagrande — portfolio deploy config ───────────────────
[build]
  publish = "."

# Pretty 404 for any unknown path
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# ── Security & performance headers ───────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https://framerusercontent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; frame-src https://player.vimeo.com; connect-src 'self' https://player.vimeo.com; media-src 'self'; base-uri 'self'; form-action 'self'"

# Long-cache static assets, always revalidate HTML
[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
