{% extends layout %}
{% block main %}
{% set u = blog_ui %}
<section class="page-hero shell">
  <p class="crumbs"><a href="/">{{ u.home }}</a> / {{ u.blog }}</p>
  <p class="eyebrow">{{ u.eyebrow }}</p>
  <h1>{{ u.title }}</h1>
  <p class="lead">{{ u.lead }}</p>
</section>
<section class="shell blog-list">
  {%- for post in posts %}
  <a class="post-card" href="/blog/{{ post.slug }}/" data-reveal>
    <span class="post-tag">{{ post.tag }}</span>
    <h3>{{ post.title }}</h3>
    <p>{{ post.excerpt }}</p>
    <span class="post-more">{{ u.read }} · {{ post.minutes }} {{ u.minutes }} <span aria-hidden="true">→</span></span>
  </a>
  {%- endfor %}
</section>
{% endblock %}
