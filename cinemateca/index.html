<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎬 Mi Cinemateca Personal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ============================================================
   TOKENS & RESET
   ============================================================ */
:root {
  --bg-deep:    #f4f1ed;
  --bg-card:    #ffffff;
  --bg-hover:   #f0ece6;
  --bg-panel:   #faf8f5;
  --border:     #e0d8cf;
  --border-l:   #c8bdb0;

  --gold:       #b8631a;
  --gold-dim:   #9a5015;
  --gold-glow:  rgba(184,99,26,0.12);

  --teal:       #1a7a74;
  --teal-dim:   #145f5a;
  --rose:       #c0394a;
  --rose-dim:   #9e2d3c;
  --lavender:   #5a4fcf;
  --sage:       #2e7d50;

  --text-1:     #1c1916;
  --text-2:     #5a4f45;
  --text-3:     #96887a;
  --text-inv:   #ffffff;

  --sidebar-w:  240px;
  --radius:     10px;
  --radius-sm:  6px;
  --radius-lg:  14px;
  --shadow:     0 4px 24px rgba(0,0,0,0.08);
  --shadow-sm:  0 2px 8px rgba(0,0,0,0.06);
  --transition: 0.18s ease;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; scroll-behavior: smooth; }
body {
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
  background: var(--bg-deep);
  color: var(--text-1);
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
}
a { color: var(--gold); text-decoration: none; }
a:hover { color: var(--gold-dim); }
button { cursor: pointer; font-family: inherit; }
input, select, textarea { font-family: inherit; }
img { max-width: 100%; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-deep); }
::-webkit-scrollbar-thumb { background: var(--border-l); border-radius: 3px; }

/* ============================================================
   LAYOUT
   ============================================================ */
#app { display: flex; min-height: 100vh; }

/* SIDEBAR */
#sidebar {
  width: var(--sidebar-w);
  background: var(--bg-card);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0; left: 0; bottom: 0;
  z-index: 200;
  transition: transform var(--transition);
  overflow-y: auto;
}
#sidebar-logo {
  padding: 22px 20px 18px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
#sidebar-logo .logo-icon {
  font-size: 1.6rem;
  filter: drop-shadow(0 0 8px var(--gold));
}
#sidebar-logo .logo-text {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-1);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
#sidebar-logo .logo-sub {
  font-size: 0.7rem;
  color: var(--text-3);
  margin-top: 1px;
}
#sidebar-nav { flex: 1; padding: 12px 0; }
.nav-section-label {
  font-size: 0.65rem;
  font-weight: 700;
  color: var(--text-3);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 10px 20px 4px;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 20px;
  color: var(--text-2);
  font-size: 0.875rem;
  font-weight: 500;
  transition: all var(--transition);
  cursor: pointer;
  border-left: 3px solid transparent;
  user-select: none;
}
.nav-item:hover { background: var(--bg-hover); color: var(--text-1); }
.nav-item.active {
  background: var(--gold-glow);
  color: var(--gold);
  border-left-color: var(--gold);
}
.nav-item .nav-icon { font-size: 1rem; width: 20px; text-align: center; }
#sidebar-footer {
  padding: 14px 16px;
  border-top: 1px solid var(--border);
  font-size: 0.7rem;
  color: var(--text-3);
}
#sidebar-footer strong { color: var(--text-2); }

/* MAIN CONTENT */
#main {
  margin-left: var(--sidebar-w);
  flex: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
#topbar {
  height: 52px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 24px;
  position: sticky; top: 0; z-index: 100;
  gap: 12px;
}
#topbar-title {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text-1);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#topbar-search {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 14px;
  flex: 0 0 260px;
}
#topbar-search input {
  background: none; border: none; outline: none;
  color: var(--text-1); font-size: 0.85rem;
  width: 200px;
}
#topbar-search input::placeholder { color: var(--text-3); }
#mobile-menu-btn {
  display: none;
  background: none; border: none;
  color: var(--text-2);
  font-size: 1.3rem;
  padding: 8px;
  margin-right: 4px;
  border-radius: var(--radius-sm);
  min-width: 40px; min-height: 40px;
  justify-content: center;
  align-items: center;
  flex-shrink: 0;
}
#mobile-menu-btn:hover { background: var(--bg-hover); }
#content-area { flex: 1; padding: 24px; }

/* ============================================================
   ACTIVE FILTERS BAR
   ============================================================ */
#active-filters-bar {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 8px 24px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
#active-filters-bar.visible { display: flex; }
#active-filters-bar .filter-label {
  font-size: 0.72rem;
  color: var(--text-3);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.filter-chip {
  display: inline-flex; align-items: center; gap: 5px;
  background: var(--gold-glow);
  border: 1px solid var(--gold-dim);
  color: var(--gold);
  border-radius: 20px;
  padding: 3px 10px;
  font-size: 0.75rem;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
}
.filter-chip:hover { background: rgba(184,99,26,0.18); }
.filter-chip .chip-x { font-size: 0.85rem; opacity: 0.7; }
#clear-all-filters {
  background: none; border: 1px solid var(--border);
  color: var(--text-3); border-radius: 20px;
  padding: 3px 10px; font-size: 0.72rem;
  transition: all var(--transition);
}
#clear-all-filters:hover { color: var(--rose); border-color: var(--rose); }

/* ============================================================
   CARDS & UTILITIES
   ============================================================ */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}
.card-sm { padding: 14px 16px; }
.card:hover { border-color: var(--border-l); }
.section-title {
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--text-1);
  margin-bottom: 20px;
  display: flex; align-items: center; gap: 8px;
}
.section-title .icon { color: var(--gold); }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; }
.grid-auto { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 12px; }
.mt-16 { margin-top: 16px; }
.mt-24 { margin-top: 24px; }
.mb-16 { margin-bottom: 16px; }
.flex { display: flex; }
.flex-center { display: flex; align-items: center; }
.flex-between { display: flex; align-items: center; justify-content: space-between; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.text-gold { color: var(--gold); }
.text-muted { color: var(--text-2); }
.text-dim { color: var(--text-3); }
.text-sm { font-size: 0.82rem; }
.text-xs { font-size: 0.72rem; }
.text-lg { font-size: 1.1rem; }
.font-bold { font-weight: 700; }
.font-mono { font-family: 'SF Mono', 'Fira Code', monospace; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ============================================================
   STAT CARDS (dashboard)
   ============================================================ */
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  display: flex; flex-direction: column; gap: 4px;
  transition: all var(--transition);
  cursor: default;
}
.stat-card:hover { border-color: var(--border-l); transform: translateY(-1px); }
.stat-card.clickable { cursor: pointer; }
.stat-card .stat-icon { font-size: 1.4rem; margin-bottom: 4px; }
.stat-card .stat-label {
  font-size: 0.72rem;
  color: var(--text-3);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.stat-card .stat-value {
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--text-1);
  line-height: 1;
}
.stat-card .stat-sub {
  font-size: 0.75rem;
  color: var(--text-2);
  margin-top: 2px;
}
.stat-card.accent-gold { border-color: var(--gold-dim); background: linear-gradient(135deg, #fff, rgba(184,99,26,0.06)); }
.stat-card.accent-teal { border-color: var(--teal-dim); background: linear-gradient(135deg, #fff, rgba(26,122,116,0.06)); }
.stat-card.accent-rose { border-color: var(--rose-dim); background: linear-gradient(135deg, #fff, rgba(192,57,74,0.06)); }
.stat-card.accent-lav  { border-color: rgba(90,79,207,0.4); background: linear-gradient(135deg, #fff, rgba(90,79,207,0.06)); }

/* ============================================================
   SCORE BADGE
   ============================================================ */
.score-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px;
  border-radius: 50%;
  font-size: 0.85rem;
  font-weight: 800;
  flex-shrink: 0;
}
.score-badge.s-10  { background: #d4f0c8; color: #2a6614; border: 1px solid #86c866; }
.score-badge.s-9   { background: #c8e4f8; color: #1a5280; border: 1px solid #6aaed6; }
.score-badge.s-8   { background: #dff0c0; color: #3a6010; border: 1px solid #96cc50; }
.score-badge.s-7   { background: #f4f0c4; color: #5a4e10; border: 1px solid #c8b840; }
.score-badge.s-6   { background: #fce8cc; color: #7a4010; border: 1px solid #e09848; }
.score-badge.s-5   { background: #fcd8cc; color: #7a2010; border: 1px solid #e07060; }
.score-badge.s-low { background: #f0c8c8; color: #6a1010; border: 1px solid #c84040; }
.score-badge.s-sm  { width: 28px; height: 28px; font-size: 0.75rem; }

/* ============================================================
   TAGS
   ============================================================ */
.tag-pill {
  display: inline-flex; align-items: center;
  background: rgba(90,79,207,0.08);
  border: 1px solid rgba(90,79,207,0.22);
  color: var(--lavender);
  border-radius: 20px;
  padding: 2px 9px;
  font-size: 0.72rem;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
}
.tag-pill:hover { background: rgba(90,79,207,0.16); }
.tag-pill.teal   { background: rgba(26,122,116,0.08); border-color: rgba(26,122,116,0.3); color: var(--teal); }
.tag-pill.gold   { background: var(--gold-glow); border-color: rgba(184,99,26,0.35); color: var(--gold); }
.tag-pill.sm     { padding: 1px 7px; font-size: 0.68rem; }

/* ============================================================
   FILMS TABLE / CARDS
   ============================================================ */
.films-controls {
  display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center;
}
.films-controls input, .films-controls select {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  color: var(--text-1);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  font-size: 0.83rem;
  outline: none;
  transition: border-color var(--transition);
}
.films-controls input:focus, .films-controls select:focus { border-color: var(--border-l); }
.view-toggle {
  display: flex;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  margin-left: auto;
}
.view-toggle button {
  background: none; border: none;
  color: var(--text-3);
  padding: 8px 12px;
  font-size: 0.9rem;
  transition: all var(--transition);
}
.view-toggle button.active { background: var(--border); color: var(--gold); }

/* TABLE VIEW */
.film-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.83rem;
}
.film-table thead th {
  padding: 10px 12px;
  text-align: left;
  color: var(--text-3);
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  transition: color var(--transition);
}
.film-table thead th:hover { color: var(--text-1); }
.film-table thead th.sorted { color: var(--gold); }
.film-table thead th .sort-arrow { margin-left: 4px; opacity: 0.5; }
.film-table thead th.sorted .sort-arrow { opacity: 1; }
.film-table tbody tr {
  border-bottom: 1px solid var(--border);
  transition: background var(--transition);
  cursor: pointer;
}
.film-table tbody tr:hover { background: var(--bg-hover); }
.film-table tbody td { padding: 10px 12px; vertical-align: middle; }
.film-table .col-titulo { font-weight: 600; color: var(--text-1); max-width: 220px; }
.film-table .col-director { color: var(--text-2); max-width: 160px; }
.film-table .col-pais { color: var(--text-2); }
.film-table .col-tags { max-width: 200px; }
.tags-cell { display: flex; flex-wrap: wrap; gap: 3px; }

/* CARD VIEW */
.films-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 14px;
}
.film-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  cursor: pointer;
  transition: all var(--transition);
  display: flex; flex-direction: column; gap: 8px;
}
.film-card:hover { border-color: var(--border-l); transform: translateY(-2px); box-shadow: var(--shadow); }
.film-card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.film-card-title { font-weight: 700; font-size: 0.92rem; line-height: 1.3; flex: 1; }
.film-card-meta { font-size: 0.75rem; color: var(--text-3); display: flex; gap: 8px; flex-wrap: wrap; }
.film-card-meta span::before { content: ''; }
.film-card-director { font-size: 0.8rem; color: var(--text-2); font-style: italic; }
.film-card-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 2px; }
.film-card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
.film-card-cat {
  font-size: 0.68rem;
  color: var(--text-3);
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 6px;
}

/* PAGINATION */
.pagination {
  display: flex; align-items: center; gap: 6px;
  justify-content: center;
  margin-top: 20px; padding: 12px 0;
  flex-wrap: wrap;
}
.pagination button {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  color: var(--text-2);
  border-radius: var(--radius-sm);
  padding: 6px 11px;
  font-size: 0.8rem;
  transition: all var(--transition);
  min-width: 34px;
}
.pagination button:hover { background: var(--bg-hover); color: var(--text-1); }
.pagination button.active { background: var(--gold-glow); border-color: var(--gold-dim); color: var(--gold); font-weight: 700; }
.pagination button:disabled { opacity: 0.3; cursor: default; }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border-radius: var(--radius-sm);
  padding: 9px 18px;
  font-size: 0.85rem;
  font-weight: 600;
  border: none;
  transition: all var(--transition);
  cursor: pointer;
}
.btn-primary { background: var(--gold); color: var(--text-inv); }
.btn-primary:hover { background: var(--gold-dim); }
.btn-ghost { background: none; border: 1px solid var(--border); color: var(--text-2); }
.btn-ghost:hover { border-color: var(--border-l); color: var(--text-1); }
.btn-danger { background: none; border: 1px solid var(--rose-dim); color: var(--rose); }
.btn-danger:hover { background: rgba(224,92,106,0.1); }
.btn-teal { background: var(--teal); color: var(--text-inv); }
.btn-teal:hover { background: var(--teal-dim); }
.btn-sm { padding: 5px 12px; font-size: 0.78rem; }
.btn-icon { padding: 7px; width: 32px; height: 32px; justify-content: center; }

/* ============================================================
   MODAL
   ============================================================ */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(28,25,22,0.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
  padding: 20px;
  backdrop-filter: blur(4px);
  animation: fadeIn 0.15s ease;
}
.modal-overlay.hidden { display: none; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--bg-card);
  border: 1px solid var(--border-l);
  border-radius: var(--radius-lg);
  width: 100%; max-width: 680px;
  max-height: 92vh;
  overflow-y: auto;
  box-shadow: var(--shadow);
  animation: slideUp 0.18s ease;
}
.modal-lg { max-width: 860px; }
@keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 24px 16px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0;
  background: var(--bg-card);
  z-index: 1;
}
.modal-header h2 { font-size: 1.1rem; font-weight: 700; }
.modal-close {
  background: none; border: 1px solid var(--border);
  color: var(--text-3);
  width: 30px; height: 30px;
  border-radius: 50%;
  font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.modal-close:hover { color: var(--text-1); border-color: var(--border-l); }
.modal-body { padding: 24px; }
.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 10px;
}

/* FILM DETAIL MODAL */
.film-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.film-detail-field { margin-bottom: 14px; }
.film-detail-field label {
  font-size: 0.68rem;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 700;
  margin-bottom: 4px;
  display: block;
}
.film-detail-field .value { font-size: 0.92rem; color: var(--text-1); font-weight: 600; }
.film-detail-field .value-link {
  font-size: 0.92rem; color: var(--teal); font-weight: 600; cursor: pointer;
  transition: color var(--transition);
}
.film-detail-field .value-link:hover { color: var(--gold); text-decoration: underline; }
.detail-stats { background: var(--bg-panel); border-radius: var(--radius); padding: 16px; margin-top: 16px; }
.detail-stats h4 { font-size: 0.75rem; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; font-weight: 700; }
.detail-stat-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.83rem;
}
.detail-stat-row:last-child { border-bottom: none; }
.detail-stat-row .ds-label { color: var(--text-2); }
.detail-stat-row .ds-value { color: var(--text-1); font-weight: 600; }
.detail-stat-row .ds-link { color: var(--teal); cursor: pointer; }
.detail-stat-row .ds-link:hover { color: var(--gold); }

/* ============================================================
   IMDB / TMDB MEDIA (pósters y rostros del elenco)
   ============================================================ */
.film-card-body { display: flex; gap: 10px; }
.film-card-poster {
  flex: 0 0 56px; width: 56px; height: 84px;
  border-radius: 6px; overflow: hidden;
  background: var(--bg-panel); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
}
.film-card-poster img { width: 100%; height: 100%; object-fit: cover; display: block; }
.film-card-poster .poster-ph { font-size: 1.3rem; color: var(--text-3); }
.film-card-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }

.table-poster-cell { width: 40px; }
.table-poster-cell img { width: 32px; height: 46px; object-fit: cover; border-radius: 4px; display: block; }
.table-poster-cell .poster-ph-sm {
  width: 32px; height: 46px; display: flex; align-items: center; justify-content: center;
  background: var(--bg-panel); border: 1px solid var(--border); border-radius: 4px;
  font-size: 0.85rem; color: var(--text-3);
}

.detail-poster-img, .detail-poster-ph { width: 120px; height: 178px; border-radius: 8px; flex-shrink: 0; }
.detail-poster-img { object-fit: cover; }
.detail-poster-ph {
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; color: var(--text-3);
  background: var(--bg-panel); border: 1px dashed var(--border-l);
}
.imdb-link { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 700; color: var(--gold); }
.imdb-link:hover { color: var(--gold-dim); text-decoration: underline; }
.cast-hint { font-size: 0.8rem; color: var(--text-3); }
.cast-hint .ds-link { color: var(--teal); cursor: pointer; }
.cast-hint .ds-link:hover { color: var(--gold); }
.cast-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 12px; margin-top: 10px; }
.cast-item { text-align: center; }
.cast-item img, .cast-item .cast-ph {
  width: 62px; height: 62px; border-radius: 50%; object-fit: cover;
  border: 2px solid var(--border); margin: 0 auto 5px; display: block;
}
.cast-item .cast-ph { display: flex; align-items: center; justify-content: center; background: var(--bg-panel); font-size: 1.2rem; color: var(--text-3); }
.cast-name { font-size: 0.72rem; font-weight: 700; color: var(--text-1); line-height: 1.25; }
.cast-character { font-size: 0.68rem; color: var(--text-3); line-height: 1.25; }

.sync-progress-track { height: 8px; border-radius: 4px; background: var(--bg-panel); border: 1px solid var(--border); overflow: hidden; margin-top: 12px; }
.sync-progress-fill { height: 100%; width: 0%; background: var(--gold); transition: width 0.2s ease; }

/* ============================================================
   FORM
   ============================================================ */
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-2);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  color: var(--text-1);
  border-radius: var(--radius-sm);
  padding: 10px 13px;
  font-size: 0.88rem;
  outline: none;
  transition: border-color var(--transition);
}
.form-group input:focus, .form-group select:focus { border-color: var(--gold-dim); }
.form-group input::placeholder { color: var(--text-3); }
.form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-row { display: flex; gap: 10px; align-items: flex-end; }
.form-row .flex-1 { flex: 1; }

/* TAG SELECTOR */
.tag-selector {
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg-panel);
  max-height: 180px;
  overflow-y: auto;
}
.tag-selector-search {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 6px;
}
.tag-selector-search input {
  background: none; border: none; outline: none;
  color: var(--text-1); font-size: 0.83rem;
  width: 100%; padding: 0;
}
.tag-selector-options { padding: 6px; display: flex; flex-wrap: wrap; gap: 5px; }
.tag-option {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-2);
  border-radius: 20px;
  padding: 3px 10px;
  font-size: 0.75rem;
  cursor: pointer;
  transition: all var(--transition);
}
.tag-option:hover { border-color: var(--lavender); color: var(--lavender); }
.tag-option.selected { background: rgba(90,79,207,0.10); border-color: var(--lavender); color: var(--lavender); }
.selected-tags {
  display: flex; flex-wrap: wrap; gap: 5px;
  min-height: 30px;
  margin-bottom: 6px;
}
.selected-tag-chip {
  display: inline-flex; align-items: center; gap: 4px;
  background: rgba(90,79,207,0.10);
  border: 1px solid rgba(90,79,207,0.30);
  color: var(--lavender);
  border-radius: 20px;
  padding: 3px 8px;
  font-size: 0.75rem;
}
.selected-tag-chip button {
  background: none; border: none;
  color: var(--lavender); opacity: 0.6;
  font-size: 0.8rem; line-height: 1;
  padding: 0 1px;
}
.add-new-tag-btn {
  background: none; border: 1px dashed var(--border);
  color: var(--text-3); border-radius: 20px;
  padding: 3px 10px; font-size: 0.75rem;
  transition: all var(--transition);
}
.add-new-tag-btn:hover { border-color: var(--sage); color: var(--sage); }
.form-hint { font-size: 0.72rem; color: var(--text-3); margin-top: 4px; }

/* ============================================================
   CHARTS CONTAINER
   ============================================================ */
.chart-container {
  position: relative;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
}
.chart-container h3 {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-2);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 14px;
}
.chart-wrapper { position: relative; height: 220px; }
.chart-wrapper-tall { position: relative; height: 300px; }
.chart-wrapper-sm { position: relative; height: 160px; }

/* ============================================================
   RANKINGS TABLE
   ============================================================ */
.rank-table { width: 100%; }
.rank-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  transition: background var(--transition);
  cursor: pointer;
}
.rank-row:hover { background: var(--bg-hover); }
.rank-num {
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--text-3);
  width: 24px;
  text-align: right;
  flex-shrink: 0;
}
.rank-num.top3 { color: var(--gold); }
.rank-info { flex: 1; min-width: 0; }
.rank-name { font-weight: 600; font-size: 0.88rem; color: var(--text-1); }
.rank-sub { font-size: 0.73rem; color: var(--text-3); }
.rank-score { font-size: 0.85rem; font-weight: 700; color: var(--gold); flex-shrink: 0; }
.rank-bar-wrap { width: 80px; flex-shrink: 0; }
.rank-bar-bg { background: var(--bg-panel); border-radius: 2px; height: 4px; }
.rank-bar-fill { background: var(--gold); border-radius: 2px; height: 4px; transition: width 0.5s ease; }

/* ============================================================
   DIRECTOR / COUNTRY PROFILE
   ============================================================ */
.profile-header {
  display: flex; align-items: center; gap: 16px;
  padding: 20px;
  background: var(--bg-panel);
  border-radius: var(--radius);
  margin-bottom: 20px;
  border: 1px solid var(--border);
}
.profile-avatar {
  width: 60px; height: 60px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), var(--teal));
  display: flex; align-items: center; justify-content: center;
  font-size: 1.4rem;
  font-weight: 800;
  color: var(--text-inv);
  flex-shrink: 0;
}
.profile-name { font-size: 1.3rem; font-weight: 800; color: var(--text-1); }
.profile-sub { font-size: 0.82rem; color: var(--text-3); margin-top: 2px; }
.profile-stats { display: flex; gap: 20px; margin-top: 8px; flex-wrap: wrap; }
.profile-stat { text-align: center; }
.profile-stat .ps-val { font-size: 1.1rem; font-weight: 800; color: var(--text-1); }
.profile-stat .ps-lbl { font-size: 0.68rem; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; }

/* ============================================================
   DISCOVERY SECTION
   ============================================================ */
.discovery-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  cursor: pointer;
  transition: all var(--transition);
}
.discovery-card:hover { border-color: var(--border-l); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.discovery-card .disc-icon { font-size: 1.8rem; margin-bottom: 8px; }
.discovery-card .disc-title { font-size: 0.85rem; font-weight: 700; color: var(--text-1); margin-bottom: 4px; }
.discovery-card .disc-val { font-size: 1.2rem; font-weight: 800; color: var(--gold); }
.discovery-card .disc-desc { font-size: 0.75rem; color: var(--text-2); margin-top: 4px; }

/* ============================================================
   HEATMAP
   ============================================================ */
.heatmap-grid { display: grid; overflow-x: auto; }
.heatmap-cell {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem;
  font-weight: 600;
  border-radius: 4px;
  cursor: pointer;
  transition: opacity var(--transition);
}
.heatmap-cell:hover { opacity: 0.8; outline: 2px solid var(--text-1); }
.heatmap-label { font-size: 0.68rem; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ============================================================
   TOAST / NOTIFICATIONS
   ============================================================ */
#toast-container {
  position: fixed;
  bottom: 20px; right: 20px;
  z-index: 9999;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  background: var(--bg-card);
  border: 1px solid var(--border-l);
  border-radius: var(--radius);
  padding: 12px 18px;
  font-size: 0.85rem;
  color: var(--text-1);
  min-width: 240px;
  box-shadow: var(--shadow);
  animation: toastIn 0.25s ease;
}
.toast.success { border-left: 3px solid var(--sage); }
.toast.error   { border-left: 3px solid var(--rose); }
.toast.info    { border-left: 3px solid var(--teal); }
@keyframes toastIn { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* ============================================================
   EMPTY STATE
   ============================================================ */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-3);
}
.empty-state .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
.empty-state h3 { font-size: 1rem; color: var(--text-2); margin-bottom: 6px; }
.empty-state p { font-size: 0.85rem; }

/* ============================================================
   LOADING
   ============================================================ */
.loading {
  display: flex; align-items: center; justify-content: center;
  padding: 40px;
  color: var(--text-3);
  font-size: 0.9rem;
  gap: 10px;
}
.spinner {
  width: 18px; height: 18px;
  border: 2px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================================
   DATA ADMIN
   ============================================================ */
.import-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 30px 20px;
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
}
.import-zone:hover, .import-zone.dragover { border-color: var(--gold-dim); background: var(--gold-glow); }
.import-zone .iz-icon { font-size: 2rem; margin-bottom: 8px; }
.import-zone h4 { font-size: 0.9rem; color: var(--text-1); margin-bottom: 4px; }
.import-zone p { font-size: 0.78rem; color: var(--text-3); }

/* ============================================================
   SCORE DISPLAY (big)
   ============================================================ */
.score-display {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 70px; height: 70px;
  border-radius: 50%;
  border: 3px solid;
  flex-shrink: 0;
}
.score-display .sd-num { font-size: 1.5rem; font-weight: 900; line-height: 1; }
.score-display .sd-max { font-size: 0.6rem; opacity: 0.6; }
.score-display.s-10  { border-color: #3a8020; color: #2a6614; background: rgba(58,128,32,0.08); }
.score-display.s-9   { border-color: #2a7ab8; color: #1a5280; background: rgba(42,122,184,0.08); }
.score-display.s-8   { border-color: #5a9020; color: #3a6010; background: rgba(90,144,32,0.08); }
.score-display.s-7   { border-color: #b0a020; color: #5a4e10; background: rgba(176,160,32,0.08); }
.score-display.s-6   { border-color: #cc7020; color: #7a4010; background: rgba(204,112,32,0.08); }
.score-display.s-5   { border-color: #cc4030; color: #7a2010; background: rgba(204,64,48,0.08); }
.score-display.s-low { border-color: #aa2020; color: #6a1010; background: rgba(170,32,32,0.08); }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 900px) {
  :root { --sidebar-w: 0px; }
  #sidebar { transform: translateX(-240px); width: 240px; }
  #sidebar.open { transform: translateX(0); width: 240px; }
  #main { margin-left: 0; }
  #mobile-menu-btn { display: flex; align-items: center; }
  #content-area { padding: 14px; }
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .grid-3 { grid-template-columns: 1fr 1fr; }
  .grid-2 { grid-template-columns: 1fr; }
  .film-detail-grid { grid-template-columns: 1fr; }
  .form-grid-2 { grid-template-columns: 1fr; }
  .films-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  .chart-wrapper { height: 180px; }
  .chart-wrapper-tall { height: 220px; }
  .section-title { font-size: 1.1rem; }
  /* Films controls: stack on tablet */
  .films-controls { flex-wrap: wrap; }
  .films-controls input[type="text"] { flex: 1 1 100%; }
  .films-controls select { flex: 1 1 calc(50% - 5px); min-width: 0; }
}

@media (max-width: 600px) {
  #content-area { padding: 10px; }
  .grid-4 { grid-template-columns: 1fr 1fr; }
  .grid-3 { grid-template-columns: 1fr; }
  .films-grid { grid-template-columns: 1fr 1fr; }
  /* Modal slides up from bottom on mobile */
  .modal { margin: 0; border-radius: 16px 16px 0 0; max-height: 90vh; }
  .modal-overlay { align-items: flex-end; padding: 0; }
  /* Hide topbar search — use the global search in sidebar instead */
  #topbar-search { display: none; }
  /* Topbar more compact */
  #topbar { padding: 0 12px; height: 48px; }
  #topbar-title { font-size: 0.85rem; }
  /* Films controls: single column on phone */
  .films-controls { flex-direction: column; gap: 8px; }
  .films-controls input, .films-controls select { width: 100%; min-width: 0; padding: 9px 12px; font-size: 0.85rem; }
  .view-toggle { margin-left: 0; align-self: flex-end; }
  /* Score filter row wraps tightly */
  #score-filters { gap: 5px; }
  .score-filter-btn { padding: 5px 10px; font-size: 0.78rem; }
  /* Table: hide less important columns on small screens */
  .film-table .col-pais { display: none; }
  .film-table .col-tags { display: none; }
  /* Cards: single column */
  .films-grid { grid-template-columns: 1fr; }
  /* Stat cards: tighter */
  .stat-card .stat-value { font-size: 1.5rem; }
  /* Rank rows */
  .rank-bar-wrap { display: none; }
  /* Card padding */
  .card { padding: 14px; }
  .chart-wrapper { height: 160px; }
  .chart-wrapper-tall { height: 200px; }
  /* Profile header stack */
  .profile-header { flex-direction: column; text-align: center; }
  .profile-stats { justify-content: center; }
  /* Discovery cards */
  .discovery-card .disc-val { font-size: 1rem; }
  /* Pagination tighter */
  .pagination button { padding: 5px 8px; font-size: 0.75rem; min-width: 30px; }
  /* Tags cloud smaller */
  .tag-cloud-item { font-size: 0.75rem; padding: 4px 8px; }
  /* Country items */
  .country-item .ci-flag { font-size: 1.1rem; }
  /* Heatmap: scroll horizontally */
  .heatmap-grid { max-width: calc(100vw - 40px); overflow-x: auto; }
  /* Form inside modal */
  .modal-body { padding: 16px; }
  .modal-header { padding: 14px 16px 12px; }
  .modal-footer { padding: 12px 16px; }
}

@media (max-width: 400px) {
  .films-grid { grid-template-columns: 1fr; }
  .grid-4 { grid-template-columns: 1fr 1fr; }
  #content-area { padding: 8px; }
  .card { padding: 12px; }
}

/* Sidebar overlay for mobile */
#sidebar-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(28,25,22,0.35);
  z-index: 199;
}
#sidebar-overlay.visible { display: block; }

/* Section-specific styles */
.section-container { display: none; }
.section-container.active { display: block; }

/* Score filter buttons */
.score-filter-btn {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  color: var(--text-2);
  border-radius: var(--radius-sm);
  padding: 5px 11px;
  font-size: 0.78rem;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
}
.score-filter-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
.score-filter-btn.active { background: var(--gold-glow); border-color: var(--gold-dim); color: var(--gold); }

/* Table wrapper for overflow */
.table-wrapper { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }

/* Progress bar */
.progress-bar { background: var(--bg-panel); border-radius: 3px; height: 6px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }

/* Tags cloud */
.tags-cloud { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-cloud-item {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 5px 10px;
  cursor: pointer;
  transition: all var(--transition);
  font-size: 0.8rem;
}
.tag-cloud-item:hover { border-color: var(--lavender); background: rgba(90,79,207,0.08); color: var(--lavender); }
.tag-cloud-item .tc-count {
  font-size: 0.68rem; font-weight: 700;
  background: var(--bg-hover);
  border-radius: 10px;
  padding: 1px 6px;
  color: var(--text-3);
}
.tag-cloud-item:hover .tc-count { background: rgba(90,79,207,0.14); color: var(--lavender); }

/* Country items */
.country-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all var(--transition);
}
.country-item:hover { border-color: var(--border-l); background: var(--bg-hover); }
.country-item .ci-flag { font-size: 1.3rem; width: 28px; text-align: center; }
.country-item .ci-name { font-weight: 600; flex: 1; }
.country-item .ci-count { font-size: 0.78rem; color: var(--text-3); }
.country-item .ci-score { font-size: 0.85rem; font-weight: 700; color: var(--gold); }

/* Tab nav */
.tab-nav { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.tab-btn {
  background: none; border: none;
  color: var(--text-3);
  padding: 10px 16px;
  font-size: 0.83rem;
  font-weight: 600;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: all var(--transition);
  white-space: nowrap;
}
.tab-btn:hover { color: var(--text-1); }
.tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* Data row utility */
.data-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.83rem;
}
.data-row:last-child { border-bottom: none; }
.data-row .dr-label { color: var(--text-2); }
.data-row .dr-value { font-weight: 600; color: var(--text-1); }

/* Search highlight */
.hl { background: rgba(232,184,75,0.3); color: var(--text-1); border-radius: 2px; padding: 0 2px; }

/* Back button */
.back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: 1px solid var(--border);
  color: var(--text-2); border-radius: var(--radius-sm);
  padding: 6px 12px; font-size: 0.8rem;
  transition: all var(--transition);
  margin-bottom: 16px;
}
.back-btn:hover { color: var(--text-1); border-color: var(--border-l); }

/* Duplicate warning */
.dupe-warning {
  background: rgba(184,99,26,0.07);
  border: 1px solid var(--gold-dim);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  font-size: 0.83rem;
  color: var(--gold-dim);
  margin-bottom: 12px;
}

/* Undo bar */
#undo-bar {
  position: fixed;
  bottom: 20px; left: 50%;
  transform: translateX(-50%);
  background: var(--bg-card);
  border: 1px solid var(--border-l);
  border-radius: var(--radius);
  padding: 10px 18px;
  display: none;
  align-items: center; gap: 12px;
  font-size: 0.85rem;
  box-shadow: var(--shadow);
  z-index: 500;
  white-space: nowrap;
}
#undo-bar.visible { display: flex; }

/* Score range filter */
.range-row { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; }
.range-row input[type="range"] { flex: 1; accent-color: var(--gold); }

/* Section back/forward */
.section-back {
  display: flex; align-items: center; gap: 8px;
  color: var(--text-3); font-size: 0.8rem;
  cursor: pointer;
  margin-bottom: 12px;
  transition: color var(--transition);
}
.section-back:hover { color: var(--text-1); }
</style>

        <div class="logo-sub" id="sidebar-count">Cargando...</div>
      </div>
    </div>

      </div>
      <div class="nav-item" data-section="peliculas">
        <span class="nav-icon">🎞️</span> Mis Películas
      </div>
      <div class="nav-section-label">Explorar</div>

function normPais(p) {
  if (!p) return '';
  const s = p.trim();
  const MAP = {
    'estados unidos ': 'Estados Unidos',
    'estados unidos':  'Estados Unidos',
    'argentina ':      'Argentina',
    'japón ':          'Japón',
    'francia ':        'Francia',
    'alemania ':       'Alemania',
    'méxico':          'México',
    'mexico':          'México',
    'unión sovietica': 'Unión Soviética',
    'union sovietica': 'Unión Soviética',
    'corea del sur':   'Corea del Sur',
  };
  return MAP[s.toLowerCase()] || s;
}

function normDirector(d) {
  if (!d) return '';
  return d.trim();
}

function parseTags(generoStr) {
  if (!generoStr || generoStr === 'null') return [];
  return generoStr.split(',')
    .map(t => t.trim())
    .filter(t => t.length > 0);
}

function scoreCls(s) {
  if (s >= 10) return 's-10';
  if (s >= 9)  return 's-9';
  if (s >= 8)  return 's-8';
  if (s >= 7)  return 's-7';
  if (s >= 6)  return 's-6';
  if (s >= 5)  return 's-5';
  return 's-low';
}

function avg(arr) {
  if (!arr.length) return 0;
  return arr.reduce((a,b) => a+b, 0) / arr.length;
}

function fmtScore(s) {
  return Number.isInteger(s) ? s.toString() : s.toFixed(1);
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ============================================================
// INDEXEDDB PERSISTENCE
// ============================================================
const DB_NAME = 'cinemateca_db';
const DB_VERSION = 1;
const STORE_NAME = 'films';
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE_NAME)) {
        d.createObjectStore(STORE_NAME, { keyPath: 'id' });
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}

function dbGetAll() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function dbPutAll(films) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    store.clear();
    films.forEach(f => store.put(f));
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function dbPut(film) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(film);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function dbDelete(id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// ============================================================
// TMDB / IMDB MEDIA INTEGRATION (pósters y rostros del elenco)
// TMDb es la base de datos que alimenta las carátulas y fichas
// de IMDb, y expone una API pública gratuita (IMDb no la tiene).
// ============================================================
const TMDB_KEY_STORAGE = 'cinemateca_tmdb_api_key';
const TMDB_API_BASE = 'https://api.themoviedb.org/3';
const TMDB_IMG_BASE = 'https://image.tmdb.org/t/p/';
const SYNC_STATE = { running: false, cancel: false, total: 0, done: 0 };

function getTmdbKey() { return (localStorage.getItem(TMDB_KEY_STORAGE) || '').trim(); }
function setTmdbKey(key) { localStorage.setItem(TMDB_KEY_STORAGE, (key || '').trim()); }
function tmdbPosterUrl(path, size='w342') { return path ? TMDB_IMG_BASE + size + path : null; }
function tmdbProfileUrl(path, size='w185') { return path ? TMDB_IMG_BASE + size + path : null; }

async function tmdbFetch(path, params) {
  const key = getTmdbKey();
  if (!key) throw new Error('NO_API_KEY');
  const url = new URL(TMDB_API_BASE + path);
  url.searchParams.set('api_key', key);
  url.searchParams.set('language', 'es-ES');
  Object.entries(params || {}).forEach(([k, v]) => {
    if (v !== null && v !== undefined && v !== '') url.searchParams.set(k, v);
  });
  const resp = await fetch(url.toString());
  if (resp.status === 401) throw new Error('BAD_API_KEY');
  if (!resp.ok) throw new Error('HTTP_' + resp.status);
  return resp.json();
}

function pickBestSearchResult(results, film, isTv) {
  if (!results || !results.length) return null;
  if (!film.año) return results[0];
  const yearOf = r => { const d = isTv ? r.first_air_date : r.release_date; return d ? parseInt(d.slice(0,4)) : null; };
  return results.find(r => yearOf(r) === film.año)
    || results.find(r => { const y = yearOf(r); return y && Math.abs(y - film.año) <= 1; })
    || results[0];
}

async function tmdbFindFilmMedia(film) {
  const kinds = film.categoria === 'Serie' ? ['tv','movie'] : ['movie','tv'];
  for (const kind of kinds) {
    const isTv = kind === 'tv';
    const yearParam = isTv ? 'first_air_date_year' : 'year';
    let data;
    try {
      const params = { query: film.titulo };
      if (film.año) params[yearParam] = film.año;
      data = await tmdbFetch(isTv ? '/search/tv' : '/search/movie', params);
      if ((!data.results || !data.results.length) && film.año) {
        data = await tmdbFetch(isTv ? '/search/tv' : '/search/movie', { query: film.titulo });
      }
    } catch (e) {
      if (e.message === 'BAD_API_KEY' || e.message === 'NO_API_KEY') throw e;
      continue;
    }
    const result = pickBestSearchResult(data.results, film, isTv);
    if (!result) continue;
    let details;
    try {
      details = await tmdbFetch((isTv ? '/tv/' : '/movie/') + result.id, { append_to_response: 'credits,external_ids' });
    } catch (e) { continue; }
    const cast = ((details.credits && details.credits.cast) || [])
      .filter(c => c.profile_path)
      .slice(0, 8)
      .map(c => ({ name: c.name, character: c.character || '', photo: tmdbProfileUrl(c.profile_path) }));
    return {
      tmdbId: result.id,
      tmdbType: kind,
      imdbId: details.imdb_id || (details.external_ids && details.external_ids.imdb_id) || null,
      posterUrl: tmdbPosterUrl(result.poster_path || details.poster_path),
      cast,
      mediaStatus: 'ok',
      mediaFetchedAt: Date.now()
    };
  }
  return { mediaStatus: 'notfound', mediaFetchedAt: Date.now() };
}

async function syncFilmMedia(id, { force = false, silent = false } = {}) {
  const film = APP.films.find(f => f.id === id);
  if (!film) return null;
  if (!force && film.mediaStatus === 'ok') return film;
  if (!getTmdbKey()) { if (!silent) showToast('⚠️ Configurá tu API Key de TMDb en Datos / Backup', 'error'); return null; }
  try {
    Object.assign(film, await tmdbFindFilmMedia(film));
    await dbPut(film);
  } catch (e) {
    film.mediaStatus = 'error';
    if (!silent) showToast(e.message === 'BAD_API_KEY' ? '❌ API Key de TMDb inválida' : '❌ Error al buscar en TMDb', 'error');
  }
  return film;
}

async function startMediaSync(onlyMissing = true) {
  if (!getTmdbKey()) { showToast('⚠️ Ingresá y guardá tu API Key de TMDb primero', 'error'); return; }
  if (SYNC_STATE.running) { showToast('⏳ Ya hay una sincronización en curso', 'info'); return; }
  const targets = APP.films.filter(f => !onlyMissing || f.mediaStatus !== 'ok');
  if (!targets.length) { showToast('✅ Todas las películas ya están sincronizadas', 'success'); return; }
  SYNC_STATE.running = true; SYNC_STATE.cancel = false; SYNC_STATE.total = targets.length; SYNC_STATE.done = 0;
  updateSyncUI();
  for (const film of targets) {
    if (SYNC_STATE.cancel) break;
    await syncFilmMedia(film.id, { force: !onlyMissing, silent: true });
    SYNC_STATE.done++;
    updateSyncUI();
    await new Promise(r => setTimeout(r, 280));
  }
  const wasCancelled = SYNC_STATE.cancel;
  SYNC_STATE.running = false;
  updateSyncUI();
  showToast(wasCancelled ? '⏸ Sincronización detenida' : '✅ Sincronización completa (' + SYNC_STATE.done + ' títulos procesados)', 'success');
  if (APP.currentSection === 'peliculas') renderPeliculas();
  if (APP.currentSection === 'datos') renderDatos();
}

function cancelMediaSync() { SYNC_STATE.cancel = true; }

function updateSyncUI() {
  const bar = document.getElementById('sync-progress-bar');
  const txt = document.getElementById('sync-progress-text');
  const btnCancel = document.getElementById('sync-cancel-btn');
  if (!bar || !txt) return;
  const pct = SYNC_STATE.total ? Math.round(SYNC_STATE.done / SYNC_STATE.total * 100) : 0;
  bar.style.width = pct + '%';
  txt.textContent = SYNC_STATE.running
    ? `Sincronizando… ${SYNC_STATE.done}/${SYNC_STATE.total} (${pct}%)`
    : (SYNC_STATE.done ? `Sincronización detenida en ${SYNC_STATE.done}/${SYNC_STATE.total}` : 'Sin iniciar');
  if (btnCancel) btnCancel.style.display = SYNC_STATE.running ? 'inline-flex' : 'none';
}

function saveTmdbKeyFromInput() {
  const input = document.getElementById('tmdb-key-input');
  if (!input) return;
  setTmdbKey(input.value);

  renderDatos();
}

      </div>`).join('')}</div>`;
  }
  if (!getTmdbKey()) return `<p class="cast-hint">Configurá tu API Key gratuita de TMDb en <span class="ds-link" onclick="closeModal('modal-film-detail');navigateTo('datos')">Datos / Backup</span> para traer automáticamente pósters y caras del elenco.</p>`;
  if (film.mediaStatus === 'notfound') return `<p class="cast-hint">No se encontró este título en TMDb.</p>`;
  if (film.mediaStatus === 'error') return `<p class="cast-hint">Ocurrió un error al buscar en TMDb. <span class="ds-link" onclick="syncFilmMedia(${film.id},{force:true}).then(()=>refreshFilmDetailIfOpen(${film.id}))">Reintentar</span></p>`;
  if (film.mediaStatus === 'ok') return `<p class="cast-hint">TMDb no tiene fotos de elenco cargadas para este título.</p>`;
  return `<p class="cast-hint">⏳ Buscando elenco en TMDb…</p>`;
}

async function initApp() {
  await openDB();
  let stored = await dbGetAll();
  if (!stored || stored.length === 0) {
    // First load — seed from embedded data
    APP.films = INITIAL_DATA.map(f => ({
      ...f,
      pais: normPais(f.pais),
      director: normDirector(f.director)
    }));
    await dbPutAll(APP.films);
    showToast('📽️ Base de datos inicializada con ' + APP.films.length + ' películas', 'success');
  } else {
    APP.films = stored.map(f => ({
      ...f,
      pais: normPais(f.pais || ''),
      director: normDirector(f.director || '')
    }));
  }
  updateSidebarCount();
  updateLastUpdate();
  renderSection('dashboard');
  setupGlobalSearch();
  setupNavigation();
  setupHashNav();
}

function updateSidebarCount() {
  const el = document.getElementById('sidebar-count');
  if (el) el.textContent = APP.films.length + ' películas';
}

function updateLastUpdate() {
  const el = document.getElementById('last-update');
  if (el) {

    el.textContent = d.toLocaleDateString('es-AR');
  }
}

// ============================================================
// NAVIGATION
// ============================================================
function setupNavigation() {
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      const sec = item.dataset.section;
      navigateTo(sec);
      if (window.innerWidth <= 900) closeSidebar();
    });
  });
}

function navigateTo(section, subView) {
  APP.currentSection = section;
  APP.subView = subView || null;

  document.querySelectorAll('.nav-item').forEach(i => {
    i.classList.toggle('active', i.dataset.section === section);
  });
  document.querySelectorAll('.section-container').forEach(s => s.classList.remove('active'));
  const sec = document.getElementById('sec-' + section);
  if (sec) sec.classList.add('active');

  const titles = {
    dashboard: 'Inicio', peliculas: 'Mis Películas',
    tags: 'Tags / Géneros', paises: 'Países', directores: 'Directores',
    estadisticas: 'Estadísticas', rankings: 'Rankings',
    descubrir: 'Descubrir', agregar: 'Agregar Película', datos: 'Datos / Backup'
  };
  document.getElementById('topbar-title').textContent = titles[section] || section;
  window.location.hash = '#' + section + (subView ? '/' + encodeURIComponent(subView.value || '') : '');
  renderSection(section);
}

function setupHashNav() {
  const hash = window.location.hash.slice(1);
  if (hash) {
    const parts = hash.split('/');
    const sec = parts[0];
    const val = parts[1] ? decodeURIComponent(parts[1]) : null;
    if (document.getElementById('sec-' + sec)) {
      navigateTo(sec, val ? { type: sec, value: val } : null);
    }
  }
  window.addEventListener('popstate', () => {
    const h = window.location.hash.slice(1);
    if (h) {
      const p = h.split('/');
      if (document.getElementById('sec-' + p[0])) navigateTo(p[0]);
    }
  });
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('visible');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('visible');
}

// ============================================================
function setupGlobalSearch() {
  const input = document.getElementById('global-search');
  let debounce;
  input.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      const q = input.value.trim();
      if (q.length > 1) {
        APP.filters.search = q;
        navigateTo('peliculas');
      } else if (q.length === 0) {
        APP.filters.search = '';
        updateActiveFiltersBar();
        if (APP.currentSection === 'peliculas') renderSection('peliculas');
      }
    }, 200);
  });
}

// ============================================================
// ACTIVE FILTERS BAR
// ============================================================
function updateActiveFiltersBar() {
  const bar = document.getElementById('active-filters-bar');
  const chips = document.getElementById('active-filter-chips');
  const f = APP.filters;
  const active = [];
  if (f.search)     active.push({ key:'search', label:'🔍 ' + f.search });
  if (f.pais)       active.push({ key:'pais', label:'🌎 ' + f.pais });
  if (f.tag)        active.push({ key:'tag', label:'🏷️ ' + f.tag });
  if (f.categoria)  active.push({ key:'categoria', label:'📁 ' + f.categoria });
  if (f.decada)     active.push({ key:'decada', label:'📅 ' + f.decada + 's' });
  if (f.scoreMin)   active.push({ key:'scoreMin', label:'⭐ ≥' + f.scoreMin });
  if (f.scoreMax)   active.push({ key:'scoreMax', label:'⭐ ≤' + f.scoreMax });
  if (f.añoMin)     active.push({ key:'añoMin', label:'📆 desde ' + f.añoMin });
  if (f.añoMax)     active.push({ key:'añoMax', label:'📆 hasta ' + f.añoMax });

  if (active.length) {
    bar.classList.add('visible');
    chips.innerHTML = active.map(a =>
      `<span class="filter-chip" onclick="removeFilter('${a.key}')">${escapeHtml(a.label)} <span class="chip-x">✕</span></span>`
    ).join('');
  } else {
    bar.classList.remove('visible');
    chips.innerHTML = '';
  }
}

function removeFilter(key) {
  APP.filters[key] = '';
  if (key === 'search') {
    document.getElementById('global-search').value = '';
  }
  updateActiveFiltersBar();
  if (APP.currentSection === 'peliculas') renderPeliculas();
}

function clearAllFilters() {
  Object.keys(APP.filters).forEach(k => APP.filters[k] = '');
  document.getElementById('global-search').value = '';
  updateActiveFiltersBar();
  if (APP.currentSection === 'peliculas') renderPeliculas();
}

function setFilter(key, val) {
  APP.filters[key] = val;
  APP.filmPage = 1;
  updateActiveFiltersBar();
  navigateTo('peliculas');
}

// ============================================================
// FILTERING ENGINE
// ============================================================
function getFilteredFilms() {
  const f = APP.filters;
  return APP.films.filter(film => {
    if (f.search) {
      const q = f.search.toLowerCase();
      const tags = parseTags(film.genero).join(' ').toLowerCase();
      if (!film.titulo.toLowerCase().includes(q) &&
          !film.director.toLowerCase().includes(q) &&
          !film.pais.toLowerCase().includes(q) &&
          !tags.includes(q)) return false;
    }
    if (f.pais && normPais(film.pais) !== normPais(f.pais)) return false;
    if (f.tag) {
      const tags = parseTags(film.genero).map(t => t.toLowerCase());
      if (!tags.includes(f.tag.toLowerCase())) return false;
    }
    if (f.categoria && film.categoria !== f.categoria) return false;
    if (f.decada) {
      const d = Math.floor(film.año / 10) * 10;
      if (d !== parseInt(f.decada)) return false;
    }
    if (f.añoMin && film.año < parseInt(f.añoMin)) return false;
    if (f.añoMax && film.año > parseInt(f.añoMax)) return false;
    if (f.scoreMin && film.puntaje < parseFloat(f.scoreMin)) return false;
    if (f.scoreMax && film.puntaje > parseFloat(f.scoreMax)) return false;
    return true;
  });
}

function destroyChart(id) {
  if (APP.charts[id]) { APP.charts[id].destroy(); delete APP.charts[id]; }
}
function createChart(id, config) {
  destroyChart(id);
  const canvas = document.getElementById(id);
  if (!canvas) return;
  APP.charts[id] = new Chart(canvas, config);
}

const CHART_DEFAULTS = {
  color: '#5a4f45',
  borderColor: '#e0d8cf',
  plugins: { legend: { display: false }, tooltip: { backgroundColor: '#ffffff', borderColor: '#c8bdb0', borderWidth: 1, titleColor: '#1c1916', bodyColor: '#5a4f45', padding: 10, boxShadow: '0 2px 8px rgba(0,0,0,0.12)' } }
};
function mergeChartDefaults(config) {
  if (!config.options) config.options = {};
  config.options.color = CHART_DEFAULTS.color;
  if (!config.options.plugins) config.options.plugins = {};
  Object.assign(config.options.plugins, CHART_DEFAULTS.plugins, config.options.plugins || {});
  return config;
}

}

        <div style="font-size:0.83rem;font-weight:600;color:var(--text-1)">${escapeHtml(tag)}</div>

      </div>
      <div style="font-size:0.8rem;color:var(--text-3);font-weight:600">${count}</div>
    </div>
  `).join('');
}

function renderDashTopFilms(films) {
  const top = [...films].filter(f=>f.puntaje).sort((a,b)=>b.puntaje-a.puntaje||a.titulo.localeCompare(b.titulo)).slice(0,10);

  el.innerHTML = top.map((f,i) => `
    <div class="rank-row" onclick="openFilmDetail(${f.id})">

      <div class="rank-info">

}

// Show/hide filter toggle button on mobile
function initFiltersToggle() {
  const btn = document.getElementById('toggle-filters-btn');
  const panel = document.getElementById('films-filter-panel');
  if (!btn || !panel) return;
  const isMobile = window.innerWidth <= 600;
  btn.style.display = isMobile ? '' : 'none';
  if (isMobile) panel.style.display = APP._filtersOpen ? 'flex' : 'none';
  else panel.style.display = 'flex';
}

function toggleFiltersPanel() {
  APP._filtersOpen = !APP._filtersOpen;
  const panel = document.getElementById('films-filter-panel');
  const btn = document.getElementById('toggle-filters-btn');
  if (panel) panel.style.display = APP._filtersOpen ? 'flex' : 'none';
  if (btn) btn.textContent = APP._filtersOpen ? '✕ Cerrar' : '⚙️ Filtros';
}

function onFilmSearch(val) {
  clearTimeout(APP._searchDebounce);
  APP._searchDebounce = setTimeout(() => {
    APP.filters.search = val.trim();
    APP.filmPage = 1;
    document.getElementById('global-search').value = val;
    updateActiveFiltersBar();
    renderPeliculasList();
  }, 150);
}

function onFilmFilter(key, val) {
  APP.filters[key] = val;
  APP.filmPage = 1;
  updateActiveFiltersBar();
  renderPeliculasList();
}

function onFilmSort(val) {
  const [col,dir] = val.split('-');
  APP.filmSort = { col, dir };
  renderPeliculasList();
}

function setFilmView(view) {
  APP.filmView = view;
  renderPeliculasList();
  // Update buttons
  document.querySelectorAll('.view-toggle button').forEach((b,i) => {
    b.classList.toggle('active', i === (view==='table'?0:1));
  });
}

function filterByScore(s) {
  if (s === null) {
    APP.filters.scoreMin = '';
    APP.filters.scoreMax = '';
  } else {
    APP.filters.scoreMin = s;
    APP.filters.scoreMax = s;
  }
  APP.filmPage = 1;
  updateActiveFiltersBar();
  renderPeliculasList();
  // Re-render score buttons
  document.querySelectorAll('.score-filter-btn').forEach((btn,i) => {
    const scores = [10,9,8,7,6,5,null];
    const bs = scores[i];
    btn.classList.toggle('active', s === bs);
  });
}

function sortFilms(films) {
  const {col, dir} = APP.filmSort;
  return [...films].sort((a,b) => {
    let va = a[col], vb = b[col];
    if (col === 'titulo' || col === 'director' || col === 'pais') {
      va = (va||'').toLowerCase();
      vb = (vb||'').toLowerCase();
    }
    if (va < vb) return dir==='asc' ? -1 : 1;
    if (va > vb) return dir==='asc' ? 1 : -1;
    return 0;
  });
}

function renderPeliculasList() {
  // Auto-switch to cards on small screens
  if (window.innerWidth <= 600 && APP.filmView === 'table') {
    APP.filmView = 'cards';
  }
  const filtered = getFilteredFilms();
  const sorted   = sortFilms(filtered);
  const total    = sorted.length;
  const pages    = Math.ceil(total / APP.filmPageSize);
  APP.filmPage   = Math.min(APP.filmPage, pages || 1);
  const start    = (APP.filmPage-1) * APP.filmPageSize;
  const page     = sorted.slice(start, start + APP.filmPageSize);
  const info     = document.getElementById('film-results-info');
  if (info) info.textContent = `${total} resultado${total!==1?'s':''} · mostrando ${start+1}–${Math.min(start+APP.filmPageSize,total)}`;
  const container = document.getElementById('film-list-container');
  if (!container) return;
  if (!total) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">🎬</div><h3>Sin resultados</h3><p>Probá con otros filtros o términos de búsqueda</p></div>`;
    document.getElementById('film-pagination').innerHTML = '';
    return;
  }
  if (APP.filmView === 'table') {
    renderFilmsTable(container, page);
  } else {
    renderFilmsCards(container, page);
  }
  renderPagination(pages, document.getElementById('film-pagination'));
}

    return escapeHtml(s.slice(0,idx)) + `<span class="hl">${escapeHtml(s.slice(idx,idx+q.length))}</span>` + escapeHtml(s.slice(idx+q.length));
  };
  container.innerHTML = `
    <div class="table-wrapper">
      <table class="film-table">
        <thead>

            <th style="width:40px"></th>

            <th onclick="setSortCol('año')" class="${APP.filmSort.col==='año'?'sorted':''}">Año <span class="sort-arrow">${APP.filmSort.col==='año'?(APP.filmSort.dir==='asc'?'↑':'↓'):'↕'}</span></th>
            <th onclick="setSortCol('director')" class="${APP.filmSort.col==='director'?'sorted':''}">Director <span class="sort-arrow">${APP.filmSort.col==='director'?(APP.filmSort.dir==='asc'?'↑':'↓'):'↕'}</span></th>
            <th onclick="setSortCol('pais')" class="${APP.filmSort.col==='pais'?'sorted':''}">País <span class="sort-arrow">${APP.filmSort.col==='pais'?(APP.filmSort.dir==='asc'?'↑':'↓'):'↕'}</span></th>
            <th>Tags</th>
            <th onclick="setSortCol('puntaje')" class="${APP.filmSort.col==='puntaje'?'sorted':''}">⭐ <span class="sort-arrow">${APP.filmSort.col==='puntaje'?(APP.filmSort.dir==='asc'?'↑':'↓'):'↕'}</span></th>
            <th style="width:80px">Acciones</th>
          </tr>
        </thead>
        <tbody>
          ${films.map(film => {
            const tags = parseTags(film.genero).slice(0,3);
            return `<tr onclick="openFilmDetail(${film.id})" title="Ver detalle">
              <td class="table-poster-cell">${tablePosterHtml(film)}</td>

              <td class="col-pais truncate" style="max-width:120px"><span onclick="event.stopPropagation();setFilter('pais','${escapeHtml(film.pais)}')" style="cursor:pointer;color:var(--teal)">${escapeHtml(film.pais)}</span></td>
              <td class="col-tags">
                <div class="tags-cell">${tags.map(t=>`<span class="tag-pill sm" onclick="event.stopPropagation();setFilter('tag','${escapeHtml(t)}')">${escapeHtml(t)}</span>`).join('')}${parseTags(film.genero).length>3?`<span style="font-size:0.68rem;color:var(--text-3)">+${parseTags(film.genero).length-3}</span>`:''}</div>
              </td>
              <td><span class="score-badge ${scoreCls(film.puntaje)} s-sm">${fmtScore(film.puntaje)}</span></td>
              <td onclick="event.stopPropagation()">
                <div style="display:flex;gap:4px">
                  <button class="btn btn-ghost btn-icon btn-sm" onclick="openFilmForm(${film.id})" title="Editar">✏️</button>

function setSortCol(col) {
  if (APP.filmSort.col === col) {
    APP.filmSort.dir = APP.filmSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    APP.filmSort.col = col;
    APP.filmSort.dir = col === 'puntaje' || col === 'año' ? 'desc' : 'asc';
  }
  const sel = document.getElementById('film-sort');
  if (sel) sel.value = col + '-' + APP.filmSort.dir;
  renderPeliculasList();

function renderFilmsCards(container, films) {
  container.innerHTML = `

              <span class="film-card-cat">${escapeHtml(film.categoria)}</span>
              <div style="display:flex;gap:4px">
                <button class="btn btn-ghost btn-icon btn-sm" onclick="event.stopPropagation();openFilmForm(${film.id})" title="Editar">✏️</button>
                <button class="btn btn-danger btn-icon btn-sm" onclick="event.stopPropagation();confirmDelete(${film.id})" title="Eliminar">🗑</button>
              </div>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderPagination(pages, container) {
  if (!container || pages <= 1) { if (container) container.innerHTML = ''; return; }
  const p = APP.filmPage;
  let html = '<div class="pagination">';
  html += `<button ${p===1?'disabled':''} onclick="goPage(${p-1})">‹ Ant</button>`;
  const range = [];
  for (let i=1;i<=pages;i++) {
    if (i===1||i===pages||Math.abs(i-p)<=2) range.push(i);
    else if (range[range.length-1]!=='...') range.push('...');
  }
  range.forEach(r => {
    if (r==='...') html += `<button disabled>…</button>`;
    else html += `<button class="${r===p?'active':''}" onclick="goPage(${r})">${r}</button>`;
  });
  html += `<button ${p===pages?'disabled':''} onclick="goPage(${p+1})">Sig ›</button>`;
  html += '</div>';
  container.innerHTML = html;
}

function goPage(p) {
  APP.filmPage = p;
  renderPeliculasList();
  document.getElementById('sec-peliculas')?.scrollIntoView({behavior:'smooth',block:'start'});
}

function openFilmDetail(id) {
  const film = APP.films.find(f => f.id === id);
  if (!film) return;
  APP._openFilmDetailId = id;
  document.getElementById('modal-film-content').innerHTML = buildFilmDetailHtml(id);
  openModal('modal-film-detail');

  if (!film.mediaStatus && getTmdbKey()) {
    syncFilmMedia(id, { silent: true }).then(() => refreshFilmDetailIfOpen(id));
  }
}

function refreshFilmDetailIfOpen(id) {
  const modal = document.getElementById('modal-film-detail');
  if (!modal || modal.classList.contains('hidden') || APP._openFilmDetailId !== id) return;
  document.getElementById('modal-film-content').innerHTML = buildFilmDetailHtml(id);
}

function buildFilmDetailHtml(id) {
  const film = APP.films.find(f => f.id === id);
  if (!film) return '';

  const tags = parseTags(film.genero);
  const sameDir = APP.films.filter(f => normDirector(f.director) === normDirector(film.director));
  const samePais = APP.films.filter(f => normPais(f.pais) === normPais(film.pais));
  const sameAño = APP.films.filter(f => f.año === film.año);
  const allSorted = [...APP.films].filter(f=>f.puntaje!=null).sort((a,b)=>b.puntaje-a.puntaje||a.titulo.localeCompare(b.titulo));
  const rank = allSorted.findIndex(f=>f.id===id)+1;
  const dirAvg = avg(sameDir.map(f=>f.puntaje).filter(s=>s!=null));
  const paisAvg = avg(samePais.map(f=>f.puntaje).filter(s=>s!=null));

  // Tag averages for this film's tags
  const tagAvgs = tags.map(tag => {
    const tagFilms = APP.films.filter(f => parseTags(f.genero).includes(tag));
    return { tag, count: tagFilms.length, avg: avg(tagFilms.map(f=>f.puntaje).filter(s=>s!=null)) };
  });

  return `
    <div class="modal-header">
      <h2 style="font-size:1rem;line-height:1.3;max-width:500px">${escapeHtml(film.titulo)}</h2>
      <button class="modal-close" onclick="closeModal('modal-film-detail')">✕</button>
    </div>
    <div class="modal-body">
      <div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:20px;align-items:flex-start">
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
          ${renderDetailPosterHtml(film)}
          ${film.imdbId ? `<a class="imdb-link" href="https://www.imdb.com/title/${film.imdbId}/" target="_blank" rel="noopener">IMDb ↗</a>` : ''}
        </div>
        <div class="score-display ${scoreCls(film.puntaje)}">
          <span class="sd-num">${fmtScore(film.puntaje)}</span>
          <span class="sd-max">/ 10</span>
        </div>
        <div style="flex:1;min-width:200px">
          <div class="film-detail-field">
            <label>Director</label>
            <div class="value-link" onclick="drillToDirector('${encodeURIComponent(film.director)}')">${escapeHtml(film.director)}</div>
          </div>
          <div style="display:flex;gap:20px;flex-wrap:wrap">
            <div class="film-detail-field">
              <label>Año</label>
              <div class="value">${film.año||'—'}</div>
            </div>
            <div class="film-detail-field">
              <label>País</label>
              <div class="value-link" onclick="drillToPais('${encodeURIComponent(film.pais)}')">${escapeHtml(film.pais)}</div>
            </div>
            <div class="film-detail-field">
              <label>Categoría</label>
              <div class="value">${escapeHtml(film.categoria)}</div>
            </div>
          </div>
        </div>
      </div>

      <!-- TAGS -->
      <div class="film-detail-field" style="margin-bottom:20px">
        <label>Tags / Géneros (${tags.length})</label>
        <div class="tags-cloud" style="margin-top:6px">
          ${tags.map(t=>`<span class="tag-pill" onclick="drillToTag('${encodeURIComponent(t)}')" title="Ver películas de ${escapeHtml(t)}">${escapeHtml(t)}</span>`).join('')}
        </div>
      </div>

      <!-- ELENCO -->
      <div class="film-detail-field" style="margin-bottom:20px">
        <label>🎭 Elenco (rostros vía TMDb)</label>
        ${renderCastBlockHtml(film)}
      </div>

      <!-- CONTEXT STATS -->
      <div class="detail-stats">
        <h4>📊 En Mi Cinemateca</h4>
        <div class="detail-stat-row">
          <span class="ds-label">Posición en ranking general</span>
          <span class="ds-value">#${rank} de ${allSorted.length}</span>
        </div>
        <div class="detail-stat-row">
          <span class="ds-label">Director — <span class="ds-link" onclick="drillToDirector('${encodeURIComponent(film.director)}')">${escapeHtml(film.director)}</span></span>
          <span class="ds-value">${sameDir.length} películas · prom. ${dirAvg.toFixed(1)}</span>
        </div>
        <div class="detail-stat-row">
          <span class="ds-label">País — <span class="ds-link" onclick="drillToPais('${encodeURIComponent(film.pais)}')">${escapeHtml(film.pais)}</span></span>
          <span class="ds-value">${samePais.length} películas · prom. ${paisAvg.toFixed(1)}</span>
        </div>
        <div class="detail-stat-row">
          <span class="ds-label">Otras películas del año ${film.año}</span>
          <span class="ds-value">${sameAño.length} en total</span>
        </div>
        ${tagAvgs.map(({tag,count,avg:ta})=>`
          <div class="detail-stat-row">
            <span class="ds-label">Tag: <span class="ds-link" onclick="drillToTag('${encodeURIComponent(tag)}')">${escapeHtml(tag)}</span></span>
            <span class="ds-value">${count} películas · prom. ${ta.toFixed(1)}</span>
          </div>
        `).join('')}
      </div>

      <!-- SAME DIRECTOR -->

  }));

    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, scales:{ x:{min:5,max:10,ticks:{color:'#7a6e65',font:{size:10}},grid:{color:'#e0d8cf'}}, y:{ticks:{color:'#5a4f45',font:{size:9}},grid:{display:false}} } }
  }));

function renderTagMatrix(tagStats) {
  const tags = tagStats.map(t=>t.tag);
  const tagFilmsMap = {};
  APP.films.forEach(f => {
    const ft = parseTags(f.genero);
    ft.forEach(t => {
      if (!tagFilmsMap[t]) tagFilmsMap[t] = new Set();
      tagFilmsMap[t].add(f.id);
    });
  });

  // Compute co-occurrences
  const matrix = [];
  let maxVal = 0;
  for (let i=0;i<tags.length;i++) {
    const row = [];
    for (let j=0;j<tags.length;j++) {
      if (i===j) { row.push(-1); continue; }
      const a = tagFilmsMap[tags[i]] || new Set();
      const b = tagFilmsMap[tags[j]] || new Set();
      const inter = [...a].filter(x=>b.has(x)).length;
      row.push(inter);
      if (inter > maxVal) maxVal = inter;
    }
    matrix.push(row);
  }

  const container = document.getElementById('tag-matrix-container');
  if (!container) return;

  const cellSize = 36;
  const labelW = 120;
  const totalW = labelW + tags.length * cellSize;

  let html = `<div style="display:grid;grid-template-columns:${labelW}px repeat(${tags.length},${cellSize}px);font-size:0.62rem;min-width:${totalW}px">`;

  // Header row
  html += `<div style="height:${cellSize}px"></div>`;
  tags.forEach(t => {
    html += `<div style="height:${labelW}px;display:flex;align-items:flex-start;justify-content:center;padding-top:4px;writing-mode:vertical-rl;transform:rotate(180deg);overflow:hidden;color:var(--text-3);font-size:0.6rem;cursor:pointer" onclick="showTagDetail('${encodeURIComponent(t)}')">${escapeHtml(t)}</div>`;
  });

  // Data rows
  matrix.forEach((row, i) => {
    html += `<div class="heatmap-label" style="height:${cellSize}px;display:flex;align-items:center;padding-right:6px;color:var(--text-2);cursor:pointer;max-width:${labelW}px" onclick="showTagDetail('${encodeURIComponent(tags[i])}')">${escapeHtml(tags[i])}</div>`;
    row.forEach((val, j) => {
      if (val === -1) {
        html += `<div style="width:${cellSize}px;height:${cellSize}px;background:var(--bg-panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:0.65rem;color:var(--text-3)">—</div>`;
      } else if (val === 0) {
        html += `<div style="width:${cellSize}px;height:${cellSize}px;background:var(--bg-deep);border:1px solid var(--border)"></div>`;
      } else {
        const intensity = val / maxVal;
        const r = Math.round(20 + intensity * 120);
        const g = Math.round(30 + intensity * 80);
        const b2 = Math.round(200 + intensity * 55);
        const bg = `rgba(${r},${g},${b2},${0.2+intensity*0.8})`;
        const tc = intensity > 0.5 ? '#ffffff' : '#1c1916';
        html += `<div title="${escapeHtml(tags[i])} + ${escapeHtml(tags[j])}: ${val}" style="width:${cellSize}px;height:${cellSize}px;background:${bg};border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:${tc};font-weight:700;cursor:pointer" onclick="showTagPair('${encodeURIComponent(tags[i])}','${encodeURIComponent(tags[j])}')">${val}</div>`;
      }
    });
  });

  html += '</div>';
  container.innerHTML = html;
}

function showTagPair(encA, encB) {

          <div class="profile-stat"><div class="ps-val">${films.filter(f=>f.puntaje>=9).length}</div><div class="ps-lbl">Con 9+</div></div>
        </div>
      </div>
    </div>

      <div class="card card-sm">

        ${topPaises.map(([p,c])=>`<div class="data-row"><span class="dr-label" style="cursor:pointer;color:var(--teal)" onclick="setFilter('pais','${escapeHtml(p)}')">${escapeHtml(p)}</span><span class="dr-value">${c}</span></div>`).join('')}

function sortTagFilms(val, encTag) {
  const tag = decodeURIComponent(encTag);
  let films = APP.films.filter(f => parseTags(f.genero).map(t=>t.toLowerCase()).includes(tag.toLowerCase()));
  const [col,dir] = val.split('-');
  films = [...films].sort((a,b)=>{
    let va=a[col],vb=b[col];
    if(col==='titulo'){va=(va||'').toLowerCase();vb=(vb||'').toLowerCase();}
    if(va<vb)return dir==='asc'?-1:1;
    if(va>vb)return dir==='asc'?1:-1;
    return 0;
  });
  const el = document.getElementById('tag-detail-films');
  if (el) el.innerHTML = renderCompactFilmList(films);
}

function renderCompactFilmList(films) {
  return films.map(f=>`
    <div class="rank-row" onclick="openFilmDetail(${f.id})">
      <div class="rank-info">
        <div class="rank-name">${escapeHtml(f.titulo)}</div>
        <div class="rank-sub">${f.año} · ${escapeHtml(f.director)} · ${escapeHtml(f.pais)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        ${parseTags(f.genero).slice(0,2).map(t=>`<span class="tag-pill sm">${escapeHtml(t)}</span>`).join('')}
        <span class="score-badge ${scoreCls(f.puntaje)} s-sm">${fmtScore(f.puntaje)}</span>
      </div>
    </div>
  `).join('');
}

function showFilmListModal(title, films) {
  const sorted = [...films].sort((a,b)=>b.puntaje-a.puntaje);

}
