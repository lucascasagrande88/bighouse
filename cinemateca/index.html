function renderDirectores() {
  const sec = document.getElementById('sec-directores');
  if (APP.subView && APP.subView.type === 'director') {
    renderDirectorDetail(sec, APP.subView.value);
    return;
  }

  const dirMap = {};
  APP.films.forEach(f => {
    const d = normDirector(f.director);
    if (!d) return;
    if (!dirMap[d]) dirMap[d] = [];
    dirMap[d].push(f);
  });

  const dirStats = Object.entries(dirMap).map(([dir, films]) => {
    const scores = films.map(f=>f.puntaje).filter(s=>s!=null);
    return { dir, count: films.length, avg: avg(scores), best: Math.max(...scores), worst: Math.min(...scores), s9: films.filter(f=>f.puntaje>=9).length, s10: films.filter(f=>f.puntaje===10).length };
  }).sort((a,b)=>b.count-a.count);

  const [sortDirBy, setSortDirBy] = ['count', null];

  sec.innerHTML = `
    <h2 class="section-title"><span class="icon">🎭</span> Directores</h2>
    <p style="color:var(--text-3);font-size:0.83rem;margin-bottom:16px">${dirStats.length} directores</p>
    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center">

      <input type="text" id="dir-search" placeholder="🔍 Buscar director..." oninput="filterDirsList(this.value)" style="background:var(--bg-panel);border:1px solid var(--border);color:var(--text-1);border-radius:var(--radius-sm);padding:6px 10px;font-size:0.82rem;outline:none;flex:1;min-width:160px">

  `;

  window._dirStats = dirStats;

function sortDirs(by) {
  document.querySelectorAll('[id^="dirsort-"]').forEach(b=>b.classList.remove('active'));
  document.getElementById('dirsort-'+by)?.classList.add('active');
  let stats = [...window._dirStats];
  if (by==='avg') stats = stats.filter(d=>d.count>=3).sort((a,b)=>b.avg-a.avg);
  else if (by==='s9') stats = stats.sort((a,b)=>b.s9-a.s9||b.count-a.count);
  else stats = stats.sort((a,b)=>b.count-a.count);
  const q = document.getElementById('dir-search')?.value;
  if (q) stats = stats.filter(d=>d.dir.toLowerCase().includes(q.toLowerCase()));
  renderDirsList(stats);
}

function filterDirsList(q) {
  let stats = [...window._dirStats];
  if (q) stats = stats.filter(d=>d.dir.toLowerCase().includes(q.toLowerCase()));
  renderDirsList(stats);
}

function renderDirsList(stats) {
  const el = document.getElementById('dirs-list');
  if (!el) return;
  if (!stats.length) { el.innerHTML = '<div class="empty-state"><div class="empty-icon">🎭</div><h3>Sin resultados</h3></div>'; return; }
  const maxCount = Math.max(...stats.map(d=>d.count));
  el.innerHTML = `

function renderEstadisticas() {
  const sec = document.getElementById('sec-estadisticas');

  const scores = films.map(f=>f.puntaje).filter(s=>s!=null);
  const promedio = avg(scores);
  const sorted_sc = [...scores].sort((a,b)=>a-b);
  const mediana = scores.length ? (scores.length%2===0 ? (sorted_sc[scores.length/2-1]+sorted_sc[scores.length/2])/2 : sorted_sc[Math.floor(scores.length/2)]) : 0;
  const moda_map = {};
  scores.forEach(s=>{ moda_map[s]=(moda_map[s]||0)+1; });
  const moda = Object.entries(moda_map).sort((a,b)=>b[1]-a[1])[0];
  const variance = scores.length ? scores.reduce((acc,s)=>acc+Math.pow(s-promedio,2),0)/scores.length : 0;
  const stddev = Math.sqrt(variance);

  // Distribution by score

  for (let i=1;i<=10;i++) distrib[i]=films.filter(f=>Math.floor(f.puntaje)===i).length;

function setRankFilmsN(n) {
  window._rankFilmsN = n;
  document.querySelectorAll('[id^="rank-film-n-"]').forEach(b=>b.classList.remove('active'));
  const key = n===99999?'Todos':n;
  document.getElementById('rank-film-n-'+key)?.classList.add('active');
  populateRankFilms();
}

function setRankFilmsCat(cat) {
  window._rankFilmsCat = cat;
  populateRankFilms();
}

function populateRankFilms() {
  let films = APP.films.filter(f=>f.puntaje!=null);
  if (window._rankFilmsCat) films = films.filter(f=>f.categoria===window._rankFilmsCat);
  films = [...films].sort((a,b)=>b.puntaje-a.puntaje||a.titulo.localeCompare(b.titulo));
  const n = window._rankFilmsN || 25;
  const top = n === 99999 ? films : films.slice(0, n);
  const max = top[0]?.puntaje || 10;
  document.getElementById('rank-films-list').innerHTML = top.map((f,i)=>`
    <div class="rank-row" onclick="openFilmDetail(${f.id})">
      <div class="rank-num ${i<3?'top3':''}">${i+1}</div>
      <div class="rank-info">
        <div class="rank-name">${escapeHtml(f.titulo)}</div>

        <div class="rank-bar-wrap" style="width:120px;margin-top:3px"><div class="rank-bar-bg"><div class="rank-bar-fill" style="width:${(f.puntaje/10*100).toFixed(0)}%"></div></div></div>
      </div>
      <span class="score-badge ${scoreCls(f.puntaje)}">${fmtScore(f.puntaje)}</span>

  `).join('');
}

function setRankDirBy(by) {
  window._rankDirBy = by;

  document.getElementById('rankd-'+by)?.classList.add('active');
  populateRankDirs();

function populateRankDirs() {
  const dirMap = {};
  APP.films.forEach(f => { const d=normDirector(f.director); if(!d) return; if(!dirMap[d])dirMap[d]=[]; dirMap[d].push(f); });
  let stats = Object.entries(dirMap).map(([dir,films])=>{
    const sc=films.map(f=>f.puntaje).filter(s=>s!=null);
    return { dir, count:films.length, avg:avg(sc), best:Math.max(...sc), s9:films.filter(f=>f.puntaje>=9).length, s10:films.filter(f=>f.puntaje===10).length };
  });
  const by = window._rankDirBy || 'avg';
  if (by==='avg') stats = stats.filter(d=>d.count>=3).sort((a,b)=>b.avg-a.avg);
  else if (by==='count') stats = stats.sort((a,b)=>b.count-a.count);
  else if (by==='s9') stats = stats.sort((a,b)=>b.s9-a.s9||b.count-a.count);
  else if (by==='s10') stats = stats.sort((a,b)=>b.s10-a.s10||b.count-a.count);
  const top = stats.slice(0,30);
  const maxVal = Math.max(...top.map(d=>by==='count'?d.count:by==='avg'?d.avg:by==='s9'?d.s9:d.s10));
  document.getElementById('rank-dirs-list').innerHTML = `
    ${by==='avg'?'<div style="font-size:0.72rem;color:var(--text-3);margin-bottom:10px">⚠️ Mínimo 3 películas para ranking por promedio</div>':''}

        <div class="rank-info">
          <div class="rank-name">${escapeHtml(d.dir)}</div>
          <div class="rank-sub">${d.count} película${d.count!==1?'s':''} · prom. ${d.avg.toFixed(1)} · mejor: ${d.best}</div>
          <div class="rank-bar-wrap" style="width:120px;margin-top:3px"><div class="rank-bar-bg"><div class="rank-bar-fill" style="width:${(by==='avg'?d.avg/10:by==='count'?d.count/maxVal:by==='s9'?d.s9/maxVal:d.s10/maxVal)*100}%"></div></div></div>
        </div>
        <span class="score-badge ${scoreCls(d.avg)}">${d.avg.toFixed(1)}</span>

function renderDescubrir() {
  const films = APP.films;
  const sec = document.getElementById('sec-descubrir');

  // Compute insights
  const tagMap = {};
  films.forEach(f=>parseTags(f.genero).forEach(t=>{ if(!tagMap[t])tagMap[t]=[]; tagMap[t].push(f); }));

  const paisMap = {};
  films.forEach(f=>{ const p=normPais(f.pais); if(!p)return; if(!paisMap[p])paisMap[p]=[]; paisMap[p].push(f); });

  const dirMap = {};
  films.forEach(f=>{ const d=normDirector(f.director); if(!d)return; if(!dirMap[d])dirMap[d]=[]; dirMap[d].push(f); });

  // "Lo que más veo pero menos me gusta"
  const tagInsights = Object.entries(tagMap).map(([t,fs])=>{
    const sc=fs.map(f=>f.puntaje).filter(s=>s!=null);
    return { tag:t, count:fs.length, avg:avg(sc) };
  }).filter(t=>t.count>=5);
  const overallAvg = avg(films.map(f=>f.puntaje).filter(s=>s!=null));
  const underrated = tagInsights.filter(t=>t.count>=15&&t.avg>overallAvg+0.3).sort((a,b)=>b.avg-a.avg).slice(0,3);
  const overrated = tagInsights.filter(t=>t.count>=20&&t.avg<overallAvg-0.5).sort((a,b)=>a.avg-b.avg).slice(0,3);

  // Director de pocos films pero alto promedio
  const hiddenDirs = Object.entries(dirMap).map(([d,fs])=>{
    const sc=fs.map(f=>f.puntaje).filter(s=>s!=null);
    return { dir:d, count:fs.length, avg:avg(sc) };
  }).filter(d=>d.count>=2&&d.count<=4&&d.avg>=8.5).sort((a,b)=>b.avg-a.avg).slice(0,5);

  // Decada favorita
  const decMap = {};
  films.forEach(f=>{const d=Math.floor(f.año/10)*10; if(!decMap[d])decMap[d]=[]; decMap[d].push(f);});
  const decaFav = Object.entries(decMap).sort((a,b)=>{
    const sc_a=a[1].map(f=>f.puntaje).filter(s=>s!=null); const sc_b=b[1].map(f=>f.puntaje).filter(s=>s!=null);
    return avg(sc_b)-avg(sc_a);
  }).filter(([,fs])=>fs.length>=10)[0];

  // Películas con max tags
  const multiTag = [...films].sort((a,b)=>parseTags(b.genero).length-parseTags(a.genero).length).slice(0,5);

  // Pais con mejor promedio (min 5)
  const topPaisAvg = Object.entries(paisMap).map(([p,fs])=>{
    const sc=fs.map(f=>f.puntaje).filter(s=>s!=null);
    return {pais:p,count:fs.length,avg:avg(sc)};
  }).filter(p=>p.count>=5).sort((a,b)=>b.avg-a.avg)[0];

  // Tag más visto con mejor promedio
  const topTagAvg = tagInsights.filter(t=>t.count>=20).sort((a,b)=>b.avg-a.avg)[0];

  sec.innerHTML = `
    <h2 class="section-title"><span class="icon">🔍</span> Descubrí Tu Historial</h2>
    <p style="color:var(--text-3);font-size:0.83rem;margin-bottom:20px">Patrones e insights basados únicamente en tus datos</p>

    <!-- KEY INSIGHTS -->
    <div class="grid-4 mb-16">
      <div class="discovery-card" onclick="setFilter('decada','${decaFav?decaFav[0]:0}')">
        <div class="disc-icon">🏅</div>
        <div class="disc-title">Tu Década Favorita</div>
        <div class="disc-val">${decaFav?decaFav[0]+'s':'—'}</div>
        <div class="disc-desc">Promedio ${decaFav?avg(decaFav[1].map(f=>f.puntaje).filter(s=>s!=null)).toFixed(2):'—'} · ${decaFav?decaFav[1].length:0} películas</div>
      </div>
      <div class="discovery-card" onclick="${topPaisAvg?`showPaisDetail('${encodeURIComponent(topPaisAvg.pais)}')`:``}">
        <div class="disc-icon">🌍</div>
        <div class="disc-title">País con Mejor Promedio</div>
        <div class="disc-val">${topPaisAvg?topPaisAvg.pais:'—'}</div>

function filterTagOptions(val) {
  const q = val.toLowerCase().trim();
  const container = document.getElementById('tag-options-container');
  if (!container) return;
  container.querySelectorAll('.tag-option').forEach(el => {
    el.style.display = (!q || el.textContent.toLowerCase().includes(q)) ? '' : 'none';
  });
  const btn = document.getElementById('add-new-tag-btn');
  if (btn) {
    const exists = window._selectedTags.map(t=>t.toLowerCase()).includes(q) ||
      [...container.querySelectorAll('.tag-option')].some(el=>el.textContent.trim().toLowerCase()===q);
    btn.style.display = (q && !exists) ? '' : 'none';
    btn.textContent = `+ Crear "${val}"`;
    btn.dataset.val = val;
  }
}

function toggleTag(enc) {
  const tag = decodeURIComponent(enc);
  const idx = window._selectedTags.indexOf(tag);
  if (idx >= 0) {
    window._selectedTags.splice(idx,1);
  } else {
    window._selectedTags.push(tag);
  }
  // Update option visual
  const safeId = tag.replace(/[^a-zA-Z0-9]/g,'_');
  const el = document.getElementById('tagopt-'+safeId);
  if (el) el.classList.toggle('selected', window._selectedTags.includes(tag));
  updateSelectedTagsDisplay();
}

function addNewTag() {
  const btn = document.getElementById('add-new-tag-btn');
  const val = btn?.dataset.val?.trim();
  if (!val) return;
  if (!window._selectedTags.includes(val)) window._selectedTags.push(val);
  document.getElementById('tag-filter-input').value = '';
  filterTagOptions('');
  updateSelectedTagsDisplay();
  showToast('✅ Tag "' + val + '" creado y seleccionado', 'success');
}

function removeSelectedTag(enc) {
  const tag = decodeURIComponent(enc);
  window._selectedTags = window._selectedTags.filter(t=>t!==tag);
  const safeId = tag.replace(/[^a-zA-Z0-9]/g,'_');
  const el = document.getElementById('tagopt-'+safeId);
  if (el) el.classList.remove('selected');
  updateSelectedTagsDisplay();
}

function updateSelectedTagsDisplay() {
  const el = document.getElementById('selected-tags-display');
  if (!el) return;
  el.innerHTML = window._selectedTags.map(t=>`
    <span class="selected-tag-chip">
      ${escapeHtml(t)}
      <button onclick="removeSelectedTag('${encodeURIComponent(t)}')" type="button">✕</button>
    </span>
  `).join('');
}

let _dupeTimeout;
function checkDuplicate() {
  if (APP.editingId) return; // No check when editing
  clearTimeout(_dupeTimeout);
  _dupeTimeout = setTimeout(() => {
    const titulo = document.getElementById('form-titulo')?.value.trim().toLowerCase();
    const año = parseInt(document.getElementById('form-año')?.value);
    const director = document.getElementById('form-director')?.value.trim().toLowerCase();
    if (!titulo || !año) return;
    const dupe = APP.films.find(f => f.titulo.toLowerCase()===titulo && f.año===año);
    const area = document.getElementById('dupe-warning-area');
    if (!area) return;
    if (dupe) {
      area.innerHTML = `<div class="dupe-warning">⚠️ Ya existe: <strong>${escapeHtml(dupe.titulo)}</strong> (${dupe.año}) · ${escapeHtml(dupe.director)} · Puntaje: ${fmtScore(dupe.puntaje)}<br>
        <span style="font-size:0.75rem">¿Es una película diferente? Podés guardarla igual.</span>
        <button class="btn btn-sm btn-ghost" style="margin-top:6px" onclick="openFilmDetail(${dupe.id});closeModal('modal-film-form')">Ver existente</button>
      </div>`;
    } else {
      area.innerHTML = '';
    }
  }, 400);
}

async function saveFilm() {
  const titulo  = document.getElementById('form-titulo')?.value.trim();
  const año     = parseInt(document.getElementById('form-año')?.value);
  const puntaje = parseFloat(document.getElementById('form-puntaje')?.value);
  const director = document.getElementById('form-director')?.value.trim();
  const pais    = document.getElementById('form-pais')?.value.trim();
  const categoria = document.getElementById('form-categoria')?.value;
  const genero  = window._selectedTags.join(', ');

  if (!titulo || !año || !puntaje || !director) {
    showToast('⚠️ Completá los campos obligatorios: Título, Año, Puntaje, Director', 'error');
    return;
  }

  if (APP.editingId) {
    const idx = APP.films.findIndex(f=>f.id===APP.editingId);
    if (idx>=0) {
      APP.films[idx] = { ...APP.films[idx], titulo, año, puntaje, director, pais: normPais(pais), categoria, genero };
      await dbPut(APP.films[idx]);
      showToast('✅ Película actualizada: ' + titulo, 'success');
    }
  } else {
    const newId = Math.max(0, ...APP.films.map(f=>f.id)) + 1;
    const newFilm = { id:newId, titulo, año, puntaje, director, pais: normPais(pais), categoria, genero };
    APP.films.push(newFilm);
    await dbPut(newFilm);
    showToast('✅ Película agregada: ' + titulo, 'success');
  }

  closeModal('modal-film-form');
  updateSidebarCount();
  updateLastUpdate();
  if (APP.currentSection === 'dashboard') renderDashboard();
  else if (APP.currentSection === 'peliculas') renderPeliculasList();
}

function confirmDelete(id) {
  const film = APP.films.find(f=>f.id===id);
  if (!film) return;
  document.getElementById('confirm-title').textContent = 'Eliminar película';
  document.getElementById('confirm-msg').innerHTML = `¿Eliminás <strong>"${escapeHtml(film.titulo)}"</strong>? Esta acción se puede deshacer.`;
  document.getElementById('confirm-ok-btn').onclick = () => { closeModal('modal-confirm'); deleteFilm(id); };
  openModal('modal-confirm');
}

async function deleteFilm(id) {
  const film = APP.films.find(f=>f.id===id);
  if (!film) return;
  APP.deletedFilm = { ...film };
  APP.films = APP.films.filter(f=>f.id!==id);
  await dbDelete(id);
  updateSidebarCount();
  showUndo('🗑 "' + film.titulo + '" eliminada');
  if (APP.currentSection === 'peliculas') renderPeliculasList();
  else if (APP.currentSection === 'dashboard') renderDashboard();
}

async function undoDelete() {
  if (!APP.deletedFilm) return;
  APP.films.push(APP.deletedFilm);
  await dbPut(APP.deletedFilm);
  showToast('↩ Restaurada: ' + APP.deletedFilm.titulo, 'success');
  APP.deletedFilm = null;
  hideUndo();
  updateSidebarCount();
  if (APP.currentSection === 'peliculas') renderPeliculasList();
  else if (APP.currentSection === 'dashboard') renderDashboard();
}

function showUndo(msg) {
  document.getElementById('undo-msg').textContent = msg;
  const bar = document.getElementById('undo-bar');
  bar.classList.add('visible');
  clearTimeout(APP.deleteTimer);
  APP.deleteTimer = setTimeout(hideUndo, 6000);
}
function hideUndo() {
  document.getElementById('undo-bar').classList.remove('visible');
}

        <div class="stat-card card-sm"><div class="stat-label">Países</div><div class="stat-value" style="font-size:1.4rem">${new Set(APP.films.map(f=>normPais(f.pais))).size}</div></div>
        <div class="stat-card card-sm"><div class="stat-label">Directores</div><div class="stat-value" style="font-size:1.4rem">${new Set(APP.films.map(f=>f.director)).size}</div></div>
      </div>
    </div>

    <div class="grid-2">
      <!-- EXPORT -->
      <div class="card">
        <h3 style="font-size:0.85rem;color:var(--text-3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:16px;font-weight:700">📤 Exportar datos</h3>
        <div style="display:flex;flex-direction:column;gap:10px">
          <button class="btn btn-ghost" onclick="exportJSON()">⬇️ Backup JSON (datos puros)</button>
          <button class="btn btn-ghost" onclick="exportCSV()">⬇️ Exportar CSV (Excel)</button>
          <p style="font-size:0.75rem;color:var(--text-3);margin-top:4px">JSON incluye todos los datos. CSV compatible con Excel/Sheets.</p>
        </div>
      </div>

      <!-- IMPORT -->
      <div class="card">
        <h3 style="font-size:0.85rem;color:var(--text-3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:16px;font-weight:700">📥 Importar</h3>
        <div class="import-zone" id="import-zone" onclick="document.getElementById('file-import').click()" ondrop="handleDrop(event)" ondragover="event.preventDefault();this.classList.add('dragover')" ondragleave="this.classList.remove('dragover')">
          <div class="iz-icon">📂</div>
          <h4>Arrastrar archivo o hacer click</h4>
          <p>Acepta: JSON backup · CSV exportado</p>
        </div>
        <input type="file" id="file-import" accept=".json,.csv" style="display:none" onchange="handleFileImport(this)">
        <div style="margin-top:10px">
          <label style="display:flex;align-items:center;gap:8px;font-size:0.82rem;color:var(--text-2);cursor:pointer">
            <input type="checkbox" id="import-merge" style="accent-color:var(--gold)">
            Modo mezcla: agregar sin borrar existentes
          </label>
        </div>
      </div>
    </div>

    <!-- RESET -->
    <div class="card mt-24" style="border-color:var(--rose-dim)">
      <h3 style="font-size:0.85rem;color:var(--rose);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;font-weight:700">⚠️ Zona de Peligro</h3>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-danger btn-sm" onclick="resetToOriginal()">🔄 Restaurar datos originales del Excel</button>
        <button class="btn btn-danger btn-sm" onclick="clearAllData()">🗑 Borrar todos los datos</button>
      </div>
      <p style="font-size:0.72rem;color:var(--text-3);margin-top:8px">Restaurar vuelve a la base del Excel original (1.123 películas). Borrar todo limpia completamente la base local.</p>
    </div>
  `;
}

function exportJSON() {
  const data = { version: 1, exportDate: new Date().toISOString(), films: APP.films };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  downloadBlob(blob, 'cinemateca_backup_' + new Date().toISOString().slice(0,10) + '.json');
  showToast('✅ Backup JSON descargado (' + APP.films.length + ' películas)', 'success');
}

function exportCSV() {
  const headers = ['id','titulo','año','pais','categoria','genero','director','puntaje'];
  const rows = APP.films.map(f => headers.map(h => {
    const val = f[h] ?? '';
    const s = String(val);
    return s.includes(',') || s.includes('"') || s.includes('\n') ? `"${s.replace(/"/g,'""')}"` : s;
  }).join(','));
  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  downloadBlob(blob, 'cinemateca_' + new Date().toISOString().slice(0,10) + '.csv');
  showToast('✅ CSV descargado (' + APP.films.length + ' filas)', 'success');
}

async function exportSelfContained() {
  showToast('⏳ Generando archivo portátil...', 'info');

  // Strategy 1: fetch the current file (works on local server or chrome with --allow-file-access)
  // Strategy 2: ask user to select the HTML file (works always)
  try {
    const resp = await fetch(window.location.href);
    if (!resp.ok) throw new Error('fetch failed');
    let html = await resp.text();
    _applySelfContainedExport(html);
  } catch(err) {
    // fetch blocked on file:// — ask user to pick the file
    showToast('📂 Seleccioná el archivo cinemateca.html para actualizarlo', 'info');
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.html';
    input.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      _applySelfContainedExport(text);
    };
    input.click();
  }
}

function _applySelfContainedExport(html) {
  try {
    const newData = JSON.stringify(APP.films);
    // Replace INITIAL_DATA — match everything between the opening [ and the closing ];
    const updated = html.replace(/const INITIAL_DATA = \[[\s\S]*?\];/, 'const INITIAL_DATA = ' + newData + ';');
    if (updated === html) {
      showToast('⚠️ No se encontró INITIAL_DATA en el archivo. Usá Backup JSON como alternativa.', 'error');
      return;
    }
    const today = new Date().toISOString().slice(0,10);
    const blob = new Blob([updated], { type: 'text/html;charset=utf-8' });
    downloadBlob(blob, 'cinemateca_' + today + '.html');
    showToast('✅ ¡Archivo portátil listo! (' + APP.films.length + ' películas incrustadas). Reemplazá el anterior con este.', 'success');
  } catch(err2) {
    showToast('❌ Error al procesar: ' + err2.message, 'error');
  }
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 500);
}

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('import-zone').classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file) processImportFile(file);
}

function handleFileImport(input) {
  const file = input.files[0];
  if (file) processImportFile(file);
  input.value = '';
}

function processImportFile(file) {
  const merge = document.getElementById('import-merge')?.checked;
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const text = e.target.result;
      let films = [];
      if (file.name.endsWith('.json')) {
        const parsed = JSON.parse(text);
        films = parsed.films || (Array.isArray(parsed) ? parsed : []);
      } else if (file.name.endsWith('.csv')) {
        films = parseCSV(text);
      }
      if (!films.length) { showToast('⚠️ No se encontraron películas en el archivo', 'error'); return; }
      if (merge) {
        const existingIds = new Set(APP.films.map(f=>f.id));
        const newFilms = films.filter(f=>!existingIds.has(f.id));
        APP.films = [...APP.films, ...newFilms];
        showToast(`✅ ${newFilms.length} películas agregadas (${films.length-newFilms.length} duplicadas omitidas)`, 'success');
      } else {
        APP.films = films.map(f=>({...f, pais: normPais(f.pais||''), director: normDirector(f.director||'')}));
        showToast(`✅ Base reemplazada: ${APP.films.length} películas importadas`, 'success');
      }
      await dbPutAll(APP.films);
      updateSidebarCount();
      updateLastUpdate();
      renderSection(APP.currentSection);
    } catch (err) {
      showToast('❌ Error al importar: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
}

function parseCSV(text) {
  const lines = text.replace(/\r/g,'').split('\n').filter(l=>l.trim());
  if (!lines.length) return [];
  const headers = lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
  return lines.slice(1).map((line,i) => {
    const vals = [];
    let cur='', inq=false;
    for (let c of line) {
      if (c==='"') inq=!inq;
      else if (c===','&&!inq) { vals.push(cur); cur=''; }
      else cur+=c;
    }
    vals.push(cur);
    const obj = {};
    headers.forEach((h,j)=>{ obj[h]=vals[j]?.replace(/^"|"$/g,'')?.trim()||''; });
    return { id: parseInt(obj.id)||i+1, titulo:obj.titulo||'', año:parseInt(obj.año)||null, pais:obj.pais||'', categoria:obj.categoria||'Película', genero:obj.genero||'', director:obj.director||'', puntaje:parseFloat(obj.puntaje)||null };
  }).filter(f=>f.titulo);
}

async function resetToOriginal() {
  if (!confirm('¿Restaurar la base de datos original del Excel? Se perderán todos los cambios.')) return;
  APP.films = INITIAL_DATA.map(f => ({ ...f, pais: normPais(f.pais), director: normDirector(f.director) }));
  await dbPutAll(APP.films);
  updateSidebarCount();
  showToast('✅ Base restaurada al original (' + APP.films.length + ' películas)', 'success');
  renderSection(APP.currentSection);
}

async function clearAllData() {
  if (!confirm('⚠️ ¿Borrar TODOS los datos? Esta acción no se puede deshacer.')) return;
  if (!confirm('¿Estás completamente seguro?')) return;
  APP.films = [];
  await dbPutAll([]);
  updateSidebarCount();
  showToast('🗑 Base de datos vaciada', 'info');
  renderSection(APP.currentSection);
}

// ============================================================
// START APP
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  initApp().catch(err => {
    console.error('Init error:', err);
    showToast('❌ Error al inicializar: ' + err.message, 'error');
  });
});

</script>
