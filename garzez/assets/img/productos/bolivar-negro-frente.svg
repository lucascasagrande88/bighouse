<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img"
     aria-label="Bolívar — Negro, vista frente">
  <defs>
    <filter id="grano"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer></filter>
    <linearGradient id="luz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="#EFECE3"/>
  <text x="400" y="620" text-anchor="middle" font-family="Archivo Black, Arial Black, sans-serif"
        font-size="240" fill="#0A0A0A" opacity="0.045" letter-spacing="-8">GARZEZ</text>
  <g opacity="0.5">
    <rect x="0" y="0" width="800" height="4" fill="#FFC700"/>
    <rect x="0" y="996" width="800" height="4" fill="#E02B1D"/>
  </g>

  <g transform="translate(400 512) scale(1.9) translate(-310 -323)">
    <path d="
    M150 400 C150 250 210 176 300 176 C390 176 450 250 450 400 Z" fill="#141414"/>
    <path d="
    M150 400 C150 250 210 176 300 176 C390 176 450 250 450 400 Z" fill="url(#luz)"/>
    <path d="M150 400 L470 400 C470 452 420 470 300 470 C210 470 150 448 150 400 Z" fill="#0c0c0c" opacity="0.32"/>
              <path d="M300 176 L300 400" stroke="#0c0c0c" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.35"/>
              <circle cx="300" cy="186" r="9" fill="#0c0c0c"/>
    <g><text x="300" y="300" text-anchor="middle" font-family="Archivo Black, Arial Black, sans-serif"
             font-size="58" fill="#F4F1EA" letter-spacing="-1">GZ</text>
       <text x="300" y="326" text-anchor="middle" font-family="Space Mono, monospace"
             font-size="13" fill="#F4F1EA" opacity="0.75" letter-spacing="4">DROP 04</text></g>
  </g>

  <rect width="800" height="1000" filter="url(#grano)" opacity="0.55"/>
  <text x="34" y="52" font-family="Space Mono, monospace" font-size="15" fill="#0A0A0A" opacity="0.55" letter-spacing="3">GZ-012</text>
  <text x="766" y="52" text-anchor="end" font-family="Space Mono, monospace" font-size="15" fill="#0A0A0A" opacity="0.55" letter-spacing="3">FRENTE</text>
  <text x="34" y="962" font-family="Space Mono, monospace" font-size="15" fill="#0A0A0A" opacity="0.55" letter-spacing="3">NEGRO</text>
  <text x="766" y="962" text-anchor="end" font-family="Space Mono, monospace" font-size="15" fill="#0A0A0A" opacity="0.55" letter-spacing="3">DROP 04</text>
</svg>