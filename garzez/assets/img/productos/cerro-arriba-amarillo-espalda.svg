    L448 594 L152 594 L152 222 L100 416 L40 400 L68 218 L150 134 Z" fill="url(#luz)"/>
    <path d="M238 106 Q300 152 362 106 Q300 130 238 106" fill="#c49e13" opacity="0.85"/>
