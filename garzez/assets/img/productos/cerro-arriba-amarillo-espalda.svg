  <g opacity="0.5">
    <rect x="0" y="0" width="800" height="4" fill="#FFC700"/>
    <rect x="0" y="996" width="800" height="4" fill="#E02B1D"/>
  </g>

  <g transform="translate(400 512) scale(1.14) translate(-300 -350)">
    <path d="
