<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img"
     aria-label="Coroto — Lona cruda, vista frente">
  <defs>
    <filter id="grano"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer></filter>
    <linearGradient id="luz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="#E2DED1"/>
  <text x="400" y="620" text-anchor="middle" font-family="Archivo Black, Arial Black, sans-serif"
        font-size="240" fill="#0A0A0A" opacity="0.045" letter-spacing="-8">GARZEZ</text>
  <g opacity="0.5">
    <rect x="0" y="0" width="800" height="4" fill="#FFC700"/>
    <rect x="0" y="996" width="800" height="4" fill="#E02B1D"/>
  </g>

  <g transform="translate(400 512) scale(1.4) translate(-300 -376)">
    <path d="
    M160 250 L440 250 L468 620 L132 620 Z" fill="#D9D0BA"/>
    <path d="
    M160 250 L440 250 L468 620 L132 620 Z" fill="url(#luz)"/>
    <path d="M212 252 C212 168 250 132 300 132 C350 132 388 168 388 252" stroke="#aea695" stroke-width="16" fill="none" opacity="0.75"/>
              <path d="M140 300 L460 300" stroke="#aea695" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.25"/>
    <g><text x="300" y="430" text-anchor="middle" font-family="Archivo Black, Arial Black, sans-serif"
             font-size="58" fill="#0A0A0A" letter-spacing="-1">COROTO</text>
       <text x="300" y="456" text-anchor="middle" font-family="Space Mono, monospace"
             font-size="13" fill="#0A0A0A" opacity="0.75" letter-spacing="4">BÁSICOS</text></g>
  </g>

  <rect width="800" height="1000" filter="url(#grano)" opacity="0.55"/>
  <text x="34" y="52" font-family="Space Mono, monospace" font-size="15" fill="#0A0A0A" opacity="0.55" letter-spacing="3">GZ-011</text>
  <text x="766" y="52" text-anchor="end" font-family="Space Mono, monospace" font-size="15" fill="#0A0A0A" opacity="0.55" letter-spacing="3">FRENTE</text>
  <text x="34" y="962" font-family="Space Mono, monospace" font-size="15" fill="#0A0A0A" opacity="0.55" letter-spacing="3">LONA CRUDA</text>
  <text x="766" y="962" text-anchor="end" font-family="Space Mono, monospace" font-size="15" fill="#0A0A0A" opacity="0.55" letter-spacing="3">BÁSICOS</text>
</svg>