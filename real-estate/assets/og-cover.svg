      <stop offset="0" stop-color="#0b0b0b"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#e3b778" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e3b778" stop-opacity="0"/>
