# Distribuidora Libertad · deploy Netlify (sitio estático, sin build)
[build]
  publish = "."

[[redirects]]
  from = "/tablero"
  to = "/tablero.html"
  status = 200
[[redirects]]
  from = "/admin"
  to = "/tablero.html"
  status = 301
[[redirects]]
  from = "/admin.html"
  to = "/tablero.html"
  status = 301
[[redirects]]
  from = "/catalogo"
  to = "/catalogo.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
[[headers]]
  for = "/tablero.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
