<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Content Factory · Chimichurri</title>
  <link rel="stylesheet" href="assets/factory.css">
</head>
<body>
  <main class="auth-page">
    <div class="auth-glow"></div>
    <div class="auth-card">
      <div class="logo"><i></i>Chimichurri<span class="dim" style="font-weight:400"> factory</span></div>
      <h1>Acceso privado</h1>
      <p>Herramienta interna. No hay registro público.</p>

      <div id="msg" class="notice notice-warn hide" style="margin-bottom:18px"></div>

      <form class="auth-form" id="form" autocomplete="on">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="username" autofocus>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" minlength="8">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit">Entrar</button>
      </form>

      <div class="auth-foot">
        ¿Perdiste la contraseña? Se regenera desde el servidor con
        <code>npm run hash-password</code>. No hay recuperación por email todavía.
        <br><br>
        <a href="/">← Volver a chimichurridiseno.com</a>
      </div>
    </div>
  </main>

  <script type="module">
    import { api } from './assets/js/api.js';

    const form = document.getElementById('form');
    const submit = document.getElementById('submit');
    const msg = document.getElementById('msg');
    const params = new URLSearchParams(location.search);
    const next = params.get('next');

    function show(text, kind = 'warn') {
      msg.textContent = text;
      msg.className = `notice notice-${kind}`;
    }

    if (params.get('expired')) show('Tu sesión venció. Volvé a entrar.');

    // Si la cookie sigue viva, no tiene sentido mostrar el login.
    api.session()
      .then(() => { location.replace(safeNext(next) || '/content-factory/factories.html'); })
      .catch(() => {});

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      submit.disabled = true;
      submit.textContent = 'Entrando…';
      msg.className = 'notice hide';

      try {
        await api.login(document.getElementById('email').value, document.getElementById('password').value);
        location.replace(safeNext(next) || '/content-factory/factories.html');
      } catch (err) {
        show(err.message || 'No se pudo entrar.', 'error');
        submit.disabled = false;
        submit.textContent = 'Entrar';
        document.getElementById('password').select();
      }
    });

    /** Sólo se acepta un destino interno: un ?next= abierto es un redirect abierto. */
    function safeNext(value) {
      if (!value) return null;
      return value.startsWith('/content-factory/') && !value.startsWith('//') ? value : null;
    }
  </script>
</body>
</html>
