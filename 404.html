<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Lucas Casagrande</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#080808;color:#f4f2ec;font-family:'Syne',sans-serif;min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden}
  .wrap{position:relative;z-index:1}
  .code{font-size:clamp(90px,22vw,220px);font-weight:800;line-height:.9;letter-spacing:-.02em;color:#b8f02a}
  .msg{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:#888880;margin:18px 0 30px}
  a{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:#080808;background:#b8f02a;text-decoration:none;padding:12px 22px;font-weight:700;display:inline-flex;align-items:center;gap:8px;transition:background .2s}
  a:hover{background:#cbf535}
  .grid{position:fixed;inset:0;background-image:linear-gradient(rgba(184,240,42,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(184,240,42,.03) 1px,transparent 1px);background-size:70px 70px;z-index:0}
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="code">404</div>
    <div class="msg">This frame doesn't exist</div>
    <a href="/">&larr; Back to work</a>
  </div>
</body>
</html>
